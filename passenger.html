<script type="module">

  // =====================================================
  // FIREBASE IMPORTS
  // =====================================================

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    updateDoc,
    onSnapshot
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  import {
    getDatabase,
    ref,
    onValue
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  // =====================================================
  // FIREBASE CONFIG
  // =====================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

    authDomain:
      "nalhati-ride.firebaseapp.com",

    databaseURL:
      "https://nalhati-ride-default-rtdb.firebaseio.com",

    projectId:
      "nalhati-ride",

    storageBucket:
      "nalhati-ride.firebasestorage.app",

    messagingSenderId:
      "1077953215118",

    appId:
      "1:1077953215118:web:7d73eac073d30523dda7df",

    measurementId:
      "G-BPZT7JKDH7"

  };


  // =====================================================
  // FIREBASE START
  // =====================================================

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);

  const realtimeDb =
    getDatabase(app);


  // =====================================================
  // ELEMENTS
  // =====================================================

  const passengerPhone =
    document.getElementById(
      "passengerPhone"
    );

  const pickup =
    document.getElementById(
      "pickup"
    );

  const destination =
    document.getElementById(
      "destination"
    );

  const passengers =
    document.getElementById(
      "passengers"
    );

  const rideDate =
    document.getElementById(
      "rideDate"
    );

  const rideTime =
    document.getElementById(
      "rideTime"
    );

  const rideNote =
    document.getElementById(
      "rideNote"
    );

  const confirmRequestBtn =
    document.getElementById(
      "confirmRequestBtn"
    );

  const bookingsList =
    document.getElementById(
      "bookingsList"
    );

  const useMyLocationBtn = document.getElementById("useMyLocationBtn");
  const locationMessage = document.getElementById("locationMessage");
  const calculateRouteBtn = document.getElementById("calculateRouteBtn");
  const routeEstimate = document.getElementById("routeEstimate");

  let pickupCoordinates = null;
  let destinationCoordinates = null;
  let estimatedRoadDistanceKm = null;


  // =====================================================
  // STATE
  // =====================================================

  let currentUser = null;

  let selectedRide = null;
  let selectedRideType = "normal";
  let unsubscribeBookings = null;

  const locationListeners =
    new Map();


  // =====================================================
  // TODAY
  // =====================================================

  const now =
    new Date();

  const yyyy =
    now.getFullYear();

  const mm =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const dd =
    String(
      now.getDate()
    ).padStart(2, "0");

  rideDate.min =
    `${yyyy}-${mm}-${dd}`;


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // =====================================================
  // PHONE INPUT
  // =====================================================

  passengerPhone.addEventListener(
    "input",
    () => {

      passengerPhone.value =
        passengerPhone.value
          .replace(/\D/g, "")
          .slice(0, 10);

    }
  );


  // =====================================================
  // VALIDATE PASSENGER
  // =====================================================

  function validatePassenger() {

    const phone =
      passengerPhone.value.trim();



    if (!/^\d{10}$/.test(phone)) {

      alert(
        "Please enter a valid 10-digit mobile number."
      );

      passengerPhone.focus();

      return false;

    }


    return true;

  }


  // Shared/Reserved selection removed; all requests use the standard booking type.


  const fareEstimate = document.getElementById("fareEstimate");
  const routeFareFromNalhati = { diha: 80, basanta: 160, rampurhat: 200, murarai: 200, lohapur: 200, kukhura: 160, kanior: 160, nalhati: 0 };
  const directRouteFares = { "basanta|rampurhat": 360 };
  function findKnownPlace(address) {
    const value = String(address || "").toLowerCase();
    const aliases = { nalhati:["nalhati","নলহাটি"], diha:["diha","দিহা"], basanta:["basanta","বসন্ত"], rampurhat:["rampurhat","রামপুরহাট"], murarai:["murarai","মুরারই"], lohapur:["lohapur","লোহাপুর"], kukhura:["kukhura","কুখুরা"], kanior:["kanior","কানিওর"] };
    return Object.keys(aliases).find(place => aliases[place].some(alias => value.includes(alias))) || null;
  }
  function getKnownRouteFare(fromAddress, toAddress) {
    const from = findKnownPlace(fromAddress), to = findKnownPlace(toAddress);
    if (!from || !to || from === to) return null;
    const key = [from, to].sort().join("|");
    if (Object.prototype.hasOwnProperty.call(directRouteFares, key)) return directRouteFares[key];
    if (routeFareFromNalhati[from] !== undefined && routeFareFromNalhati[to] !== undefined) return routeFareFromNalhati[from] + routeFareFromNalhati[to];
    return null;
  }
  function updateKnownFareEstimate() {
    const from = pickup.value.trim(), to = destination.value.trim();
    if (!from || !to) { fareEstimate.classList.add("hidden"); fareEstimate.textContent = ""; return; }
    const fare = getKnownRouteFare(from, to);
    fareEstimate.classList.remove("hidden");
    if (fare === null) fareEstimate.textContent = "Fare estimate is unavailable for this route. The driver will provide a quote.";
    else fareEstimate.textContent = "Estimated fare: ₹" + fare + " — The driver will confirm the final fare.";
  }
  pickup.addEventListener("input", updateKnownFareEstimate);
  destination.addEventListener("input", updateKnownFareEstimate);

  // =====================================================
  // PICKUP GPS + ROUTE DISTANCE (on-demand lookup)
  // =====================================================

  useMyLocationBtn.onclick = () => {
    if (!navigator.geolocation) {
      locationMessage.textContent = "Location services are unavailable on this phone. Please enter the address manually.";
      return;
    }
    useMyLocationBtn.disabled = true;
    locationMessage.textContent = "Getting your current location…";
    navigator.geolocation.getCurrentPosition(async position => {
      pickupCoordinates = {
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };
      try {
        const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
          encodeURIComponent(pickupCoordinates.lat) + "&lon=" + encodeURIComponent(pickupCoordinates.lon);
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          pickup.value = data.display_name || (pickupCoordinates.lat.toFixed(5) + ", " + pickupCoordinates.lon.toFixed(5));
        } else {
          pickup.value = pickupCoordinates.lat.toFixed(5) + ", " + pickupCoordinates.lon.toFixed(5);
        }
        locationMessage.textContent = "✅ Current pickup location added. Please verify the address.";
      } catch (error) {
        pickup.value = pickupCoordinates.lat.toFixed(5) + ", " + pickupCoordinates.lon.toFixed(5);
        locationMessage.textContent = "Location received, but the address could not be identified.";
      } finally {
        useMyLocationBtn.disabled = false;
      }
    }, error => {
      locationMessage.textContent = "Unable to get your location. Enable location permission and try again, or enter the address manually.";
      useMyLocationBtn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };

  async function geocodeAddress(address) {
    const query = address + ", West Bengal, India";
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(query);
    const response = await fetch(url);
    if (!response.ok) throw new Error("Unable to look up the address.");
    const results = await response.json();
    if (!results.length) throw new Error('This address was not found on the map. Please enter a more specific address.');
    return { lat: Number(results[0].lat), lon: Number(results[0].lon) };
  }

  calculateRouteBtn.onclick = async () => {
    const from = pickup.value.trim();
    const to = destination.value.trim();
    if (!from || !to) {
      routeEstimate.classList.remove("hidden");
      routeEstimate.textContent = "Enter both pickup and destination addresses to calculate the distance.";
      return;
    }
    calculateRouteBtn.disabled = true;
    calculateRouteBtn.textContent = "⏳ Calculating road distance…";
    routeEstimate.classList.remove("hidden");
    routeEstimate.textContent = "Calculating road distance from the map…";
    try {
      const start = pickupCoordinates || await geocodeAddress(from);
      const end = destinationCoordinates || await geocodeAddress(to);
      const routeUrl = "https://router.project-osrm.org/route/v1/driving/" +
        start.lon + "," + start.lat + ";" + end.lon + "," + end.lat + "?overview=false";
      const routeResponse = await fetch(routeUrl);
      if (!routeResponse.ok) throw new Error("The road distance service is currently unavailable.");
      const routeData = await routeResponse.json();
      if (routeData.code !== "Ok" || !routeData.routes || !routeData.routes.length) {
        throw new Error("No road route was found between these locations. Please check the addresses.");
      }
      estimatedRoadDistanceKm = Math.round((routeData.routes[0].distance / 1000) * 10) / 10;
      pickupCoordinates = start;
      destinationCoordinates = end;
      routeEstimate.innerHTML = "<b>🛣️ Estimated road distance: " + estimatedRoadDistanceKm +
        " km</b><br><span class='muted'>Map distance is an estimate and may vary if the route is inaccurate.</span>";
      updateKnownFareEstimate();
    } catch (error) {
      estimatedRoadDistanceKm = null;
      routeEstimate.textContent = error.message || "Unable to calculate the distance. Check the addresses and try again.";
    } finally {
      calculateRouteBtn.disabled = false;
      calculateRouteBtn.textContent = "🗺️ View Distance & Estimated Fare";
    }
  };

  pickup.addEventListener("input", () => { pickupCoordinates = null; estimatedRoadDistanceKm = null; });
  destination.addEventListener("input", () => { destinationCoordinates = null; estimatedRoadDistanceKm = null; });


  // =====================================================
  // DIRECT BOOKING REQUEST
  // =====================================================

  confirmRequestBtn.onclick =
    async () => {

      if (!validatePassenger()) {
        return;
      }

      const from =
        pickup.value.trim();

      const to =
        destination.value.trim();

      if (!from) {
        alert(
          "Pickup Point লিখুন।\\nPlease enter Pickup Point."
        );
        pickup.focus();
        return;
      }

      if (!to) {
        alert(
          "Drop Point লিখুন।\\nPlease enter Drop Point."
        );
        destination.focus();
        return;
      }

      if (
        from.toLowerCase() ===
        to.toLowerCase()
      ) {
        alert(
          "Pickup এবং Drop Point একই হতে পারবে না।\\nPickup and Drop Point cannot be the same."
        );
        return;
      }

      if (!rideDate.value) {
        alert(
          "Please select a date."
        );
        rideDate.focus();
        return;
      }

      if (!rideTime.value) {
        alert(
          "Please select a time."
        );
        rideTime.focus();
        return;
      }

      if (!currentUser) {
        alert(
          "Connecting to the booking service. Please try again in a moment."
        );
        return;
      }

      selectedRide = {
        type: "booking",
        rideType: selectedRideType,
        from: from,
        to: to,
        passengers: Number(passengers.value),
        date: rideDate.value,
        time: rideTime.value,
        note: rideNote.value.trim(),
        estimatedFare: getKnownRouteFare(from, to)
      };

      await sendBookingRequest();

    };


  // =====================================================
  // SEND NEW BOOKING
  // =====================================================

  async function sendBookingRequest() {

      if (!selectedRide) {

        alert(
          "Booking information is missing."
        );

        return;

      }


      if (!currentUser) {

        alert(
          "Firebase is not connected yet."
        );

        return;

      }


      if (!validatePassenger()) {
        return;
      }


      confirmRequestBtn.disabled =
        true;

      confirmRequestBtn.textContent =
        "⏳ Submitting booking request...";


      try {

        await addDoc(

          collection(
            db,
            "rides"
          ),

          {

            type:
              "booking",

            rideType:
              selectedRide.rideType,

            from:
              selectedRide.from,

            to:
              selectedRide.to,

            passengers:
              selectedRide.passengers,

            date:
              selectedRide.date,

            time:
              selectedRide.time,

            note:
              selectedRide.note,

            estimatedDistanceKm:
              estimatedRoadDistanceKm || null,

            estimatedFare:
              selectedRide.estimatedFare,

            fare:
              0,

            originalFare:
              0,

            discountAmount:
              0,

            fareType:
              "driver_quote",

            fareStatus:
              "waiting",

            status:
              "searching",

            passengerId:
              currentUser.uid,

            passengerPhone:
              passengerPhone.value.trim(),

            driverId:
              "",

            driverName:
              "",

            driverPhone:
              "",

            autoNumber:
              "",

            createdAt:
              new Date()

          }

        );


        clearBookingForm();


        alert(
          "✅ Booking request sent successfully."
        );


        bookingsList.scrollIntoView({
          behavior: "smooth"
        });

      }

      catch (error) {

        console.error(
          "Booking Error:",
          error
        );


        alert(
          "Unable to submit booking request.\n\n" +
          error.message
        );

      }

      finally {

        confirmRequestBtn.disabled =
          false;

        confirmRequestBtn.textContent =
          "🚕 Submit Booking Request";

      }

  }



  // =====================================================
  // CLEAR NEW BOOKING FORM
  // =====================================================

  function clearBookingForm() {

    pickup.value = "";
    destination.value = "";
    pickupCoordinates = null;
    destinationCoordinates = null;
    estimatedRoadDistanceKm = null;
    routeEstimate.classList.add("hidden");
    routeEstimate.textContent = "";
    fareEstimate.classList.add("hidden");
    fareEstimate.textContent = "";
    locationMessage.textContent = "";

    passengers.value = "1";

    rideDate.value = "";

    rideTime.value = "";

    rideNote.value = "";

    selectedRide = null;
    selectedRideType = "normal";

  }


  // =====================================================
  // LISTEN TO ALL PASSENGER BOOKINGS
  // =====================================================

  function listenToAllBookings() {

    if (unsubscribeBookings) {

      unsubscribeBookings();

    }


    unsubscribeBookings =
      onSnapshot(

        collection(
          db,
          "rides"
        ),

        snapshot => {

          const rides = [];


          snapshot.forEach(
            rideDoc => {

              const data =
                rideDoc.data();


              if (
                data.passengerId ===
                currentUser.uid
              ) {

                if (
                  data.status !==
                  "completed"
                  &&
                  data.status !==
                  "cancelled"
                ) {

                  rides.push({

                    id:
                      rideDoc.id,

                    ...data

                  });

                }

              }

            }
          );


          rides.sort(
            (a, b) => {

              const aTime =
                a.createdAt?.toMillis
                  ?
                  a.createdAt.toMillis()
                  :
                  0;

              const bTime =
                b.createdAt?.toMillis
                  ?
                  b.createdAt.toMillis()
                  :
                  0;

              return bTime - aTime;

            }
          );


          renderAllBookings(
            rides
          );

        },

        error => {

          console.error(
            "Bookings Error:",
            error
          );


          bookingsList.innerHTML = `

            <div class="error">
              ❌ Unable to load bookings.
            </div>

          `;

        }

      );

  }


  // =====================================================
  // RENDER ALL BOOKINGS
  // =====================================================

  function renderAllBookings(
    rides
  ) {

    const currentIds =
      new Set(
        rides.map(
          ride => ride.id
        )
      );


    for (
      const [rideId, unsubscribe]
      of locationListeners
    ) {

      if (
        !currentIds.has(rideId)
      ) {

        unsubscribe();

        locationListeners.delete(
          rideId
        );

      }

    }


    if (!rides.length) {

      bookingsList.innerHTML = `

        <div class="empty-booking">
          There are no active bookings right now.
        </div>

      `;

      return;

    }


    bookingsList.innerHTML = "";


    rides.forEach(
      (ride, index) => {

        const card =
          createBookingCard(
            ride,
            index + 1
          );


        bookingsList.appendChild(
          card
        );

      }
    );

  }


  // =====================================================
  // CREATE BOOKING CARD
  // =====================================================

  function createBookingCard(
    ride,
    bookingNumber
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "booking-card";


    card.innerHTML = `

      <div class="booking-number">
        Booking ${bookingNumber}
      </div>

      <h3>
        🚕 ${escapeHtml(
          ride.from || ""
        )}
        →
        ${escapeHtml(
          ride.to || ""
        )}
      </h3>

      <div class="summary-row">

        <span class="label">
          👥 Passengers:
        </span>

        ${ride.passengers || 1}

      </div>


      <div class="summary-row">

        <span class="label">
          📅 Date:
        </span>

        ${escapeHtml(
          ride.date || ""
        )}

      </div>


      <div class="summary-row">

        <span class="label">
          ⏰ Time:
        </span>

        ${escapeHtml(
          ride.time || ""
        )}

      </div>


      ${
        ride.note
        ?
        `
        <div class="summary-row">

          <span class="label">
            📝 Note:
          </span>

          ${escapeHtml(
            ride.note
          )}

        </div>
        `
        :
        ""
      }


      <div
        class="status-box"
        id="status-${ride.id}">
      </div>


      <div
        id="fare-${ride.id}">
      </div>


      <div
        id="driver-${ride.id}">
      </div>


      <div
        id="location-${ride.id}">
      </div>


      <button
        id="cancel-${ride.id}"
        class="danger">
        ❌ Cancel Booking
      </button>

    `;


    const cancelButton =
      card.querySelector(
        `#cancel-${ride.id}`
      );


    cancelButton.onclick =
      () => {

        cancelBooking(
          ride.id
        );

      };


    updateBookingCard(
      card,
      ride
    );


    return card;

  }


  // =====================================================
  // UPDATE ONE BOOKING CARD
  // =====================================================

  function updateBookingCard(
    card,
    ride
  ) {

    const statusElement =
      card.querySelector(
        `#status-${ride.id}`
      );

    const fareElement =
      card.querySelector(
        `#fare-${ride.id}`
      );

    const driverElement =
      card.querySelector(
        `#driver-${ride.id}`
      );

    const cancelButton =
      card.querySelector(
        `#cancel-${ride.id}`
      );


    const status =
      ride.status ||
      "searching";


    // STATUS

    if (
      status ===
      "searching"
    ) {

      statusElement.innerHTML = `

        <div class="waiting">
          🔎 Waiting for the driver’s response...
        </div>

        <div class="small">
          The driver will review your booking
          and send a fare quote.
        </div>

      `;

    }

    else if (
      status ===
      "fare_sent"
    ) {

      statusElement.innerHTML = `

        <div class="waiting">
          💰 The driver has sent a fare quote.
        </div>

        <div class="small">
          Review the fare below to confirm your booking.
        </div>

      `;

    }

    else if (
      status ===
      "confirmed"
      ||
      status ===
      "fare_accepted"
    ) {

      statusElement.innerHTML = `

        <div class="success-text">
          ✅ Booking Confirmed
        </div>

        <div class="small">
          The driver has confirmed your booking.
        </div>

      `;

    }

    else if (
      status ===
      "started"
    ) {

      statusElement.innerHTML = `

        <div class="success-text">
          🚕 Ride Started
        </div>

        <div class="small">
          Your ride is now in progress.
        </div>

      `;

    }

    else {

      statusElement.innerHTML = "";

    }


    // FARE

    fareElement.innerHTML = "";


    if (
      Number(ride.fare) > 0
    ) {

      const fareBox =
        document.createElement(
          "div"
        );

      fareBox.className =
        "fare-box";


      fareBox.innerHTML = `

        <div>
          💰 Driver’s Fare
        </div>

        <div class="fare-price">
          ₹${Number(
            ride.fare
          )}
        </div>

      `;


      if (
        status ===
        "fare_sent"
      ) {

        const acceptButton =
          document.createElement(
            "button"
          );

        acceptButton.className =
          "success";

        acceptButton.textContent =
          "✅ Confirm Booking";


        acceptButton.onclick =
          () => {

            acceptFare(
              ride.id,
              ride.fare
            );

          };


        fareBox.appendChild(
          acceptButton
        );


      }

      else {

        const accepted =
          document.createElement(
            "div"
          );

        accepted.className =
          "success-text";

        accepted.style.marginTop =
          "8px";

        accepted.textContent =
          "✅ Fare accepted";

        fareBox.appendChild(
          accepted
        );

      }


      fareElement.appendChild(
        fareBox
      );

    }


    // DRIVER INFORMATION

    driverElement.innerHTML = "";


    if (
      ride.driverName ||
      ride.driverPhone ||
      ride.autoNumber
    ) {

      driverElement.innerHTML = `

        <div class="route-box">

          <h3>
            🚕 Driver Information
          </h3>

          ${
            ride.driverName
            ?
            `
            <div class="summary-row">
              <span class="label">
                👤 Driver:
              </span>
              ${escapeHtml(
                ride.driverName
              )}
            </div>
            `
            :
            ""
          }


          ${
            ride.autoNumber
            ?
            `
            <div class="summary-row">
              <span class="label">
                🚖 Auto:
              </span>
              ${escapeHtml(
                ride.autoNumber
              )}
            </div>
            `
            :
            ""
          }


          ${
            ride.driverPhone
            ?
            `
            <button
              class="primary"
              id="call-driver-${ride.id}">
              📞 Call Driver
            </button>
            `
            :
            ""
          }

        </div>

      `;


      if (
        ride.driverPhone
      ) {

        const callButton =
          driverElement.querySelector(
            `#call-driver-${ride.id}`
          );


        if (callButton) {

          callButton.onclick =
            () => {

              window.location.href =
                "tel:" +
                ride.driverPhone;

            };

        }

      }

    }


    // LIVE LOCATION

    const shouldShowLocation =

      (
        status ===
        "confirmed"
        ||
        status ===
        "fare_accepted"
        ||
        status ===
        "started"
      )
      &&
      ride.driverId;


    if (
      shouldShowLocation
    ) {

      listenDriverLocation(
        ride.id,
        ride.driverId
      );

    }

    else {

      stopLocationListener(
        ride.id
      );

      const locationElement =
        card.querySelector(
          `#location-${ride.id}`
        );


      if (locationElement) {

        locationElement.innerHTML =
          "";

      }

    }


    // CANCEL BUTTON

    if (
      status ===
      "completed"
      ||
      status ===
      "cancelled"
    ) {

      cancelButton.classList.add(
        "hidden"
      );

    }

    else {

      cancelButton.classList.remove(
        "hidden"
      );

    }

  }


  // =====================================================
  // ACCEPT FARE
  // =====================================================

  async function acceptFare(
    rideId,
    fare
  ) {

    const ok =
      confirm(
        "Do you accept the driver’s fare of ₹" +
        fare +
        "?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "confirmed",

          fareStatus:
            "accepted",

          passengerFareAcceptedAt:
            new Date()

        }

      );


      alert(
        "✅ Fare accepted। Booking Confirmed!"
      );

    }

    catch (error) {

      console.error(
        "Accept Fare Error:",
        error
      );


      alert(
        "Unable to accept the fare.\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // REJECT FARE
  // =====================================================

  async function rejectFare(
    rideId
  ) {

    const ok =
      confirm(
        "Do you want to reject this fare?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "fare_rejected",

          fareStatus:
            "rejected"

        }

      );


      alert(
        "❌ You have rejected the fare."
      );

    }

    catch (error) {

      console.error(
        "Reject Fare Error:",
        error
      );


      alert(
        "Unable to reject the fare.\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // CANCEL BOOKING
  // =====================================================

  async function cancelBooking(
    rideId
  ) {

    const ok =
      confirm(
        "Do you want to cancel this booking?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "cancelled",

          cancelledBy:
            "passenger",

          cancelledAt:
            new Date()

        }

      );


      alert(
        "❌ Booking cancelled."
      );

    }

    catch (error) {

      console.error(
        "Cancel Error:",
        error
      );


      alert(
        "Unable to cancel booking.\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // DRIVER LIVE LOCATION
  // =====================================================

  function listenDriverLocation(
    rideId,
    driverId
  ) {

    if (
      locationListeners.has(
        rideId
      )
    ) {

      return;

    }


    const locationRef =
      ref(
        realtimeDb,
        "drivers/" +
        driverId +
        "/location"
      );


    const unsubscribe =
      onValue(

        locationRef,

        snapshot => {

          const locationElement =
            document.getElementById(
              `location-${rideId}`
            );


          if (!locationElement) {
            return;
          }


          const data =
            snapshot.val();


          if (
            !data ||
            data.online !== true ||
            typeof data.lat !== "number" ||
            typeof data.lng !== "number"
          ) {

            locationElement.innerHTML = `

              <div class="location-box">

                <b>
                  📍 Driver Live Location
                </b>

                <p class="small">
                  The driver’s live location is currently unavailable.
                </p>

              </div>

            `;

            return;

          }


          const lat =
            data.lat;

          const lng =
            data.lng;

          const accuracy =
            data.accuracy ||
            "";


          locationElement.innerHTML = `

            <div class="location-box">

              <b>
                🟢 Driver Live Location
              </b>

              <p class="small">
                🚕 The driver is currently online.
              </p>

              ${
                accuracy
                ?
                `
                <p class="small">
                  Location accuracy:
                  ${accuracy} m
                </p>
                `
                :
                ""
              }


              <button
                class="success"
                id="map-${rideId}">
                📍 View Driver on Google Maps
              </button>

            </div>

          `;


          const mapButton =
            document.getElementById(
              `map-${rideId}`
            );


          if (mapButton) {

            mapButton.onclick =
              () => {

                window.open(

                  "https://www.google.com/maps?q=" +
                  lat +
                  "," +
                  lng,

                  "_blank"

                );

              };

          }

        },

        error => {

          console.error(
            "Location Error:",
            error
          );


          const locationElement =
            document.getElementById(
              `location-${rideId}`
            );


          if (locationElement) {

            locationElement.innerHTML = `

              <div class="location-box">

                <b>
                  📍 Driver Live Location
                </b>

                <p class="small error">
                  Unable to load live location.
                </p>

              </div>

            `;

          }

        }

      );


    locationListeners.set(
      rideId,
      unsubscribe
    );

  }


  // =====================================================
  // STOP ONE LOCATION LISTENER
  // =====================================================

  function stopLocationListener(
    rideId
  ) {

    const unsubscribe =
      locationListeners.get(
        rideId
      );


    if (unsubscribe) {

      unsubscribe();

      locationListeners.delete(
        rideId
      );

    }

  }


  // =====================================================
  // ANONYMOUS LOGIN
  // =====================================================

  signInAnonymously(
    auth
  )

    .catch(
      error => {

        console.error(
          "Anonymous Login Error:",
          error
        );


        bookingsList.innerHTML = `

          <div class="error">

            ❌ Unable to connect to the booking service.

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      }
    );


  // =====================================================
  // AUTH STATE
  // =====================================================

  onAuthStateChanged(

    auth,

    user => {

      if (!user) {
        return;
      }


      currentUser =
        user;


      listenToAllBookings();

    }

  );


  // =====================================================
  // PAGE CLEANUP
  // =====================================================

  window.addEventListener(
    "beforeunload",
    () => {

      if (
        unsubscribeBookings
      ) {

        unsubscribeBookings();

      }


      for (
        const unsubscribe
        of locationListeners.values()
      ) {

        unsubscribe();

      }


      locationListeners.clear();

    }
  );

</script>
