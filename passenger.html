<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nalhati Ride - Passenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .type-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .type-btn {
      flex: 1;
      padding: 14px 8px;
      border: 2px solid #d1d5db;
      background: white;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .type-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:disabled {
      background: #9ca3af;
    }

    .summary {
      background: #f0fdf4;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .status-box {
      text-align: center;
    }

    .success {
      color: #15803d;
      font-size: 23px;
      font-weight: bold;
    }

    .booking-id {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 13px;
    }

    .cancel-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .price-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚖 Nalhati Ride</h1>
    <p>Passenger App</p>
  </div>

  <div class="container">

    <!-- BOOKING FORM -->
    <div class="card" id="bookingCard">

      <h2>আপনি কীভাবে যাবেন?</h2>

      <div class="type-buttons">
        <button class="type-btn active" id="normalBtn">
          🚖 Normal Ride
        </button>

        <button class="type-btn" id="reserveBtn">
          🚕 Reserve Auto
        </button>
      </div>

      <!-- NORMAL RIDE -->
      <div id="normalForm">

        <label>📍 কোথা থেকে যাবেন?</label>
        <select id="normalFrom">
          <option value="">Pickup নির্বাচন করুন</option>
          <option value="Nalhati">Nalhati</option>
          <option value="Murarai">Murarai</option>
        </select>

        <label>🏁 কোথায় যাবেন?</label>
        <select id="normalTo">
          <option value="">Destination নির্বাচন করুন</option>
          <option value="Nalhati">Nalhati</option>
          <option value="Murarai">Murarai</option>
        </select>

        <div class="summary" style="margin-top:15px;">
          💰 ভাড়া: <strong>₹25</strong>
        </div>

      </div>

      <!-- RESERVE RIDE -->
      <div id="reserveForm" class="hidden">

        <label>📍 Pickup Location</label>
        <input
          type="text"
          id="reserveFrom"
          placeholder="যেখান থেকে গাড়ি নিতে চান"
        >

        <label>🏁 Destination</label>
        <input
          type="text"
          id="reserveTo"
          placeholder="যেখানে যেতে চান"
        >

        <label>👥 যাত্রী সংখ্যা</label>
        <select id="passengers">
          <option value="">যাত্রী সংখ্যা নির্বাচন করুন</option>
          <option value="1">1 জন</option>
          <option value="2">2 জন</option>
          <option value="3">3 জন</option>
          <option value="4">4 জন</option>
          <option value="5">5 জন</option>
          <option value="6">6 জন</option>
          <option value="7">7 জন</option>
          <option value="8">8 জন</option>
        </select>

        <label>📅 যাওয়ার তারিখ</label>
        <input type="date" id="reserveDate">

        <label>⏰ যাওয়ার সময়</label>
        <input type="time" id="reserveTime">

        <label>💰 প্রস্তাবিত ভাড়া</label>
        <input
          type="number"
          id="reserveFare"
          placeholder="যেমন: 500"
          min="0"
        >

        <div class="price-note">
          ভাড়া না জানলে খালি রাখতে পারেন। সেক্ষেত্রে Driver-এর সঙ্গে আলোচনা করা যাবে।
        </div>

        <label>📝 অতিরিক্ত কথা (ঐচ্ছিক)</label>
        <textarea
          id="reserveNote"
          placeholder="যেমন: ফেরার সময় অপেক্ষা করতে হবে, পরিবারের সঙ্গে যাব ইত্যাদি"
        ></textarea>

      </div>

      <button class="main-btn" id="reviewBtn">
        বুকিংয়ের তথ্য দেখুন
      </button>

    </div>


    <!-- BOOKING SUMMARY -->
    <div class="card hidden" id="summaryCard">

      <h2>📋 Booking Summary</h2>

      <div class="summary" id="summaryText"></div>

      <button class="main-btn" id="confirmBtn">
        ✅ Confirm Booking
      </button>

      <button
        class="main-btn"
        id="editBtn"
        style="background:#6b7280;"
      >
        ✏️ Edit
      </button>

    </div>


    <!-- BOOKING STATUS -->
    <div class="card hidden" id="statusCard">

      <div class="status-box">

        <div class="success" id="statusTitle">
          Booking Confirmed!
        </div>

        <p id="statusMessage">
          আপনার বুকিং নেওয়া হয়েছে।
        </p>

        <div id="statusDetails"></div>

        <p><strong>Booking ID</strong></p>

        <div class="booking-id" id="bookingId"></div>

        <button class="cancel-btn" id="cancelBtn">
          ❌ Booking Cancel করুন
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",
      authDomain: "nalhati-ride.firebaseapp.com",
      projectId: "nalhati-ride",
      storageBucket: "nalhati-ride.firebasestorage.app",
      messagingSenderId: "1077953215118",
      appId: "1:1077953215118:web:7d73eac073d30523dda7df",
      measurementId: "G-BPZT7JKDH7"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    let currentUser = null;
    let currentRideId = null;
    let unsubscribeRide = null;

    let bookingType = "normal";


    // Firebase Anonymous Login
    signInAnonymously(auth)
      .catch((error) => {
        console.error("Login Error:", error);
        alert("Login সমস্যা হয়েছে। আবার চেষ্টা করুন।");
      });


    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
      }
    });


    // Elements
    const normalBtn = document.getElementById("normalBtn");
    const reserveBtn = document.getElementById("reserveBtn");

    const normalForm = document.getElementById("normalForm");
    const reserveForm = document.getElementById("reserveForm");

    const bookingCard = document.getElementById("bookingCard");
    const summaryCard = document.getElementById("summaryCard");
    const statusCard = document.getElementById("statusCard");

    const reviewBtn = document.getElementById("reviewBtn");
    const confirmBtn = document.getElementById("confirmBtn");
    const editBtn = document.getElementById("editBtn");

    const summaryText = document.getElementById("summaryText");

    const statusTitle = document.getElementById("statusTitle");
    const statusMessage = document.getElementById("statusMessage");
    const statusDetails = document.getElementById("statusDetails");

    const bookingId = document.getElementById("bookingId");
    const cancelBtn = document.getElementById("cancelBtn");


    // NORMAL / RESERVE SWITCH
    normalBtn.addEventListener("click", () => {

      bookingType = "normal";

      normalBtn.classList.add("active");
      reserveBtn.classList.remove("active");

      normalForm.classList.remove("hidden");
      reserveForm.classList.add("hidden");

    });


    reserveBtn.addEventListener("click", () => {

      bookingType = "reserve";

      reserveBtn.classList.add("active");
      normalBtn.classList.remove("active");

      reserveForm.classList.remove("hidden");
      normalForm.classList.add("hidden");

    });


    // REVIEW BOOKING
    reviewBtn.addEventListener("click", () => {

      let html = "";

      if (bookingType === "normal") {

        const from = document.getElementById("normalFrom").value;
        const to = document.getElementById("normalTo").value;

        if (!from || !to) {
          alert("Pickup এবং Destination নির্বাচন করুন।");
          return;
        }

        if (from === to) {
          alert("Pickup এবং Destination আলাদা হতে হবে।");
          return;
        }

        html = `
          <strong>🚖 Normal Ride</strong><br><br>
          📍 Pickup: <strong>${from}</strong><br>
          🏁 Destination: <strong>${to}</strong><br>
          💰 ভাড়া: <strong>₹25</strong>
        `;

      } else {

        const from = document.getElementById("reserveFrom").value.trim();
        const to = document.getElementById("reserveTo").value.trim();
        const passengers = document.getElementById("passengers").value;
        const date = document.getElementById("reserveDate").value;
        const time = document.getElementById("reserveTime").value;
        const fare = document.getElementById("reserveFare").value;
        const note = document.getElementById("reserveNote").value.trim();

        if (!from) {
          alert("Pickup Location লিখুন।");
          return;
        }

        if (!to) {
          alert("Destination লিখুন।");
          return;
        }

        if (!passengers) {
          alert("যাত্রী সংখ্যা নির্বাচন করুন।");
          return;
        }

        if (!date) {
          alert("তারিখ নির্বাচন করুন।");
          return;
        }

        if (!time) {
          alert("সময় নির্বাচন করুন।");
          return;
        }


        const fareText = fare
          ? `₹${fare}`
          : "Driver-এর সঙ্গে আলোচনা";


        html = `
          <strong>🚕 Reserve Auto</strong><br><br>

          📍 Pickup: <strong>${from}</strong><br>

          🏁 Destination: <strong>${to}</strong><br>

          👥 যাত্রী: <strong>${passengers} জন</strong><br>

          📅 তারিখ: <strong>${date}</strong><br>

          ⏰ সময়: <strong>${time}</strong><br>

          💰 ভাড়া: <strong>${fareText}</strong><br>

          ${note
            ? `📝 Note: <strong>${note}</strong>`
            : ""
          }
        `;

      }


      summaryText.innerHTML = html;

      bookingCard.classList.add("hidden");
      summaryCard.classList.remove("hidden");

    });


    // EDIT
    editBtn.addEventListener("click", () => {

      summaryCard.classList.add("hidden");
      bookingCard.classList.remove("hidden");

    });


    // CONFIRM BOOKING
    confirmBtn.addEventListener("click", async () => {

      if (!currentUser) {
        alert("অ্যাপ প্রস্তুত হচ্ছে। একটু পরে চেষ্টা করুন।");
        return;
      }

      confirmBtn.disabled = true;
      confirmBtn.innerText = "Booking হচ্ছে...";


      try {

        let rideData = {};

        if (bookingType === "normal") {

          const from = document.getElementById("normalFrom").value;
          const to = document.getElementById("normalTo").value;

          rideData = {
            type: "normal",

            from: from,
            to: to,

            passengers: 1,

            fare: 25,
            fareType: "fixed",

            date: "",
            time: "",

            note: "",

            status: "searching",

            passengerId: currentUser.uid,

            driverId: "",

            createdAt: new Date()
          };

        } else {

          const from = document.getElementById("reserveFrom").value.trim();
          const to = document.getElementById("reserveTo").value.trim();

          const passengers =
            Number(document.getElementById("passengers").value);

          const date =
            document.getElementById("reserveDate").value;

          const time =
            document.getElementById("reserveTime").value;

          const fareValue =
            document.getElementById("reserveFare").value;

          const note =
            document.getElementById("reserveNote").value.trim();


          rideData = {

            type: "reserve",

            from: from,
            to: to,

            passengers: passengers,

            fare: fareValue
              ? Number(fareValue)
              : 0,

            fareType: fareValue
              ? "proposed"
              : "negotiable",

            date: date,
            time: time,

            note: note,

            status: "searching",

            passengerId: currentUser.uid,

            driverId: "",

            createdAt: new Date()

          };

        }


        const docRef =
          await addDoc(
            collection(db, "rides"),
            rideData
          );


        currentRideId = docRef.id;

        bookingId.innerText = currentRideId;

        summaryCard.classList.add("hidden");
        statusCard.classList.remove("hidden");

        updateStatusUI(rideData);


        // Listen for Driver updates
        unsubscribeRide =
          onSnapshot(
            doc(db, "rides", currentRideId),
            (snapshot) => {

              if (!snapshot.exists()) {
                return;
              }

              const ride = snapshot.data();

              updateStatusUI(ride);

            }
          );


      } catch (error) {

        console.error(error);

        alert(
          "Booking করতে সমস্যা হয়েছে: " +
          error.message
        );

        confirmBtn.disabled = false;
        confirmBtn.innerText = "✅ Confirm Booking";

      }

    });


    // STATUS UI
    function updateStatusUI(ride) {

      if (ride.type === "reserve") {

        statusDetails.innerHTML = `
          <div class="summary">

            🚕 <strong>Reserve Auto</strong><br><br>

            📍 ${ride.from}<br>

            🏁 ${ride.to}<br>

            👥 ${ride.passengers || 1} জন<br>

            📅 ${ride.date || "-"}<br>

            ⏰ ${ride.time || "-"}<br>

            💰 ${
              ride.fare > 0
                ? "₹" + ride.fare
                : "আলোচনা সাপেক্ষে"
            }

          </div>
        `;

      } else {

        statusDetails.innerHTML = `
          <div class="summary">

            🚖 Normal Ride<br><br>

            📍 ${ride.from}<br>

            🏁 ${ride.to}<br>

            💰 ₹${ride.fare}

          </div>
        `;

      }


      if (ride.status === "searching") {

        statusTitle.innerText =
          "Booking Confirmed!";

        statusMessage.innerText =
          ride.type === "reserve"
            ? "আপনার Reserve Booking নেওয়া হয়েছে। এখন Driver খোঁজা হচ্ছে..."
            : "আপনার বুকিং নেওয়া হয়েছে। এখন Driver খোঁজা হচ্ছে...";

      }


      else if (ride.status === "accepted") {

        statusTitle.innerText =
          "🚕 Driver পাওয়া গেছে!";

        statusMessage.innerText =
          "Driver আপনার Booking Accept করেছেন।";

      }


      else if (ride.status === "started") {

        statusTitle.innerText =
          "🚗 Ride Started";

        statusMessage.innerText =
          "আপনার যাত্রা শুরু হয়েছে।";

      }


      else if (ride.status === "completed") {

        statusTitle.innerText =
          "✅ Ride Completed";

        statusMessage.innerText =
          "আপনার যাত্রা সম্পূর্ণ হয়েছে। ধন্যবাদ!";

        cancelBtn.classList.add("hidden");

      }


      else if (ride.status === "cancelled") {

        statusTitle.innerText =
          "❌ Booking Cancelled";

        statusMessage.innerText =
          "এই Booking বাতিল করা হয়েছে।";

        cancelBtn.classList.add("hidden");

      }

    }


    // CANCEL BOOKING
    cancelBtn.addEventListener("click", async () => {

      if (!currentRideId) {
        return;
      }


      const ok =
        confirm(
          "আপনি কি সত্যিই Booking Cancel করতে চান?"
        );


      if (!ok) {
        return;
      }


      try {

        await updateDoc(
          doc(db, "rides", currentRideId),
          {
            status: "cancelled"
          }
        );

        cancelBtn.classList.add("hidden");

      } catch (error) {

        console.error(error);

        alert(
          "Cancel করতে সমস্যা হয়েছে।"
        );

      }

    });

  </script>

</body>
</html>
