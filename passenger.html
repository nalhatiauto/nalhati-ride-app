<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride - Passenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 15px;
    }

    .header {
      background: #2196f3;
      color: white;
      padding: 20px 15px;
      margin: -15px -15px 15px -15px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      opacity: .9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #2196f3;
      color: white;
    }

    .success {
      background: #4caf50;
      color: white;
    }

    .danger {
      background: #d32f2f;
      color: white;
    }

    .secondary {
      background: #757575;
      color: white;
    }

    .warning {
      background: #ff9800;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .summary-row {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
    }

    .fare-box {
      background: #e8f5e9;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      margin-top: 12px;
    }

    .fare-price {
      font-size: 30px;
      font-weight: bold;
      color: #2e7d32;
      margin: 8px 0;
    }

    .status-box {
      background: #e3f2fd;
      border-left: 5px solid #2196f3;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .location-box {
      background: #f1f8e9;
      border-left: 5px solid #4caf50;
      padding: 15px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .small {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .success-text {
      color: #2e7d32;
      font-weight: bold;
    }

    .waiting {
      color: #ef6c00;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚕 Nalhati Ride</h1>
    <p>Passenger App</p>
  </div>


  <!-- Passenger Information -->

  <div class="card">

    <h2>👤 Passenger Information</h2>

    <label for="passengerName">
      নাম
    </label>

    <input
      id="passengerName"
      type="text"
      maxlength="50"
      placeholder="আপনার নাম">


    <label for="passengerPhone">
      ফোন নম্বর
    </label>

    <input
      id="passengerPhone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="১০ সংখ্যার ফোন নম্বর">

    <p class="small">
      Booking-এর জন্য নাম ও ফোন নম্বর প্রয়োজন।
    </p>

  </div>


  <!-- Booking Request -->

  <div class="card">

    <h2>🚕 গাড়ি বুক করুন</h2>

    <label for="pickup">
      📍 কোথা থেকে যাবেন?
    </label>

    <input
      id="pickup"
      type="text"
      maxlength="200"
      placeholder="Pickup address লিখুন">


    <label for="destination">
      📍 কোথায় যাবেন?
    </label>

    <input
      id="destination"
      type="text"
      maxlength="200"
      placeholder="Destination address লিখুন">


    <label for="passengers">
      👥 যাত্রী সংখ্যা
    </label>

    <select id="passengers">
      <option value="1">1 জন</option>
      <option value="2">2 জন</option>
      <option value="3">3 জন</option>
      <option value="4">4 জন</option>
      <option value="5">5 জন</option>
      <option value="6">6 জন</option>
      <option value="7">7 জন</option>
      <option value="8">8 জন</option>
    </select>


    <label for="rideDate">
      📅 তারিখ
    </label>

    <input
      id="rideDate"
      type="date">


    <label for="rideTime">
      ⏰ সময়
    </label>

    <input
      id="rideTime"
      type="time">


    <label for="rideNote">
      📝 অতিরিক্ত তথ্য
    </label>

    <textarea
      id="rideNote"
      maxlength="500"
      placeholder="প্রয়োজনে কিছু লিখুন"></textarea>


    <button
      id="reviewBtn"
      class="primary">
      👀 Booking Review
    </button>

  </div>


  <!-- Review -->

  <div
    id="reviewSection"
    class="card hidden">

    <h2>📋 Booking Review</h2>

    <div id="reviewContent"></div>

    <button
      id="confirmRequestBtn"
      class="success">
      🚕 Booking Request পাঠান
    </button>

    <button
      id="editBtn"
      class="secondary">
      ✏️ Edit
    </button>

  </div>


  <!-- Booking Status -->

  <div
    id="statusSection"
    class="card hidden">

    <h2>📌 Booking Status</h2>

    <div
      id="statusContent"
      class="status-box">
    </div>

    <div
      id="fareArea">
    </div>

    <div
      id="driverArea">
    </div>

    <div
      id="locationArea">
    </div>

    <button
      id="cancelBtn"
      class="danger">
      ❌ Cancel Booking
    </button>

  </div>


  <script type="module">

    // =====================================================
    // Firebase Imports
    // =====================================================

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
      getDatabase,
      ref,
      onValue
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // =====================================================
    // Firebase Configuration
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

      authDomain:
        "nalhati-ride.firebaseapp.com",

      databaseURL:
        "https://nalhati-ride-default-rtdb.firebaseio.com",

      projectId:
        "nalhati-ride",

      storageBucket:
        "nalhati-ride.firebasestorage.app",

      messagingSenderId:
        "1077953215118",

      appId:
        "1:1077953215118:web:7d73eac073d30523dda7df",

      measurementId:
        "G-BPZT7JKDH7"
    };


    // =====================================================
    // Firebase Start
    // =====================================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const realtimeDb =
      getDatabase(app);


    // =====================================================
    // Elements
    // =====================================================

    const passengerName =
      document.getElementById("passengerName");

    const passengerPhone =
      document.getElementById("passengerPhone");

    const pickup =
      document.getElementById("pickup");

    const destination =
      document.getElementById("destination");

    const passengers =
      document.getElementById("passengers");

    const rideDate =
      document.getElementById("rideDate");

    const rideTime =
      document.getElementById("rideTime");

    const rideNote =
      document.getElementById("rideNote");

    const reviewBtn =
      document.getElementById("reviewBtn");

    const reviewSection =
      document.getElementById("reviewSection");

    const reviewContent =
      document.getElementById("reviewContent");

    const confirmRequestBtn =
      document.getElementById("confirmRequestBtn");

    const editBtn =
      document.getElementById("editBtn");

    const statusSection =
      document.getElementById("statusSection");

    const statusContent =
      document.getElementById("statusContent");

    const fareArea =
      document.getElementById("fareArea");

    const driverArea =
      document.getElementById("driverArea");

    const locationArea =
      document.getElementById("locationArea");

    const cancelBtn =
      document.getElementById("cancelBtn");


    // =====================================================
    // State
    // =====================================================

    let currentUser = null;

    let currentRideId = null;

    let selectedRide = null;

    let unsubscribeRide = null;

    let unsubscribeLocation = null;


    // =====================================================
    // Escape HTML
    // =====================================================

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    // =====================================================
    // Minimum Date
    // =====================================================

    const today =
      new Date()
        .toISOString()
        .split("T")[0];

    rideDate.min =
      today;


    // =====================================================
    // Phone Input
    // =====================================================

    passengerPhone.addEventListener(
      "input",
      () => {

        passengerPhone.value =
          passengerPhone.value
            .replace(/\D/g, "")
            .slice(0, 10);

      }
    );


    // =====================================================
    // Validation
    // =====================================================

    function validatePassenger() {

      const name =
        passengerName.value.trim();

      const phone =
        passengerPhone.value.trim();

      if (!name) {

        alert("আপনার নাম লিখুন।");

        passengerName.focus();

        return false;

      }


      if (!/^\d{10}$/.test(phone)) {

        alert(
          "সঠিক ১০ সংখ্যার ফোন নম্বর লিখুন।"
        );

        passengerPhone.focus();

        return false;

      }


      return true;

    }


    // =====================================================
    // Review Booking
    // =====================================================

    reviewBtn.onclick =
      () => {

        if (!validatePassenger()) {
          return;
        }


        const from =
          pickup.value.trim();

        const to =
          destination.value.trim();


        if (!from) {

          alert("Pickup address লিখুন।");

          pickup.focus();

          return;

        }


        if (!to) {

          alert("Destination address লিখুন।");

          destination.focus();

          return;

        }


        if (
          from.toLowerCase() ===
          to.toLowerCase()
        ) {

          alert(
            "Pickup এবং Destination একই হতে পারবে না।"
          );

          return;

        }


        if (!rideDate.value) {

          alert("তারিখ নির্বাচন করুন।");

          rideDate.focus();

          return;

        }


        if (!rideTime.value) {

          alert("সময় নির্বাচন করুন।");

          rideTime.focus();

          return;

        }


        if (!currentUser) {

          alert(
            "Firebase connection হচ্ছে। একটু পরে চেষ্টা করুন।"
          );

          return;

        }


        selectedRide = {

          type:
            "booking",

          from:
            from,

          to:
            to,

          passengers:
            Number(passengers.value),

          date:
            rideDate.value,

          time:
            rideTime.value,

          note:
            rideNote.value.trim(),

          fare:
            0,

          fareStatus:
            "waiting",

          fareType:
            "driver_quote",

          status:
            "searching"

        };


        reviewContent.innerHTML = `

          <div class="summary-row">
            <span class="label">👤 নাম:</span>
            ${escapeHtml(passengerName.value.trim())}
          </div>

          <div class="summary-row">
            <span class="label">📞 ফোন:</span>
            ${escapeHtml(passengerPhone.value.trim())}
          </div>

          <div class="summary-row">
            <span class="label">📍 From:</span>
            ${escapeHtml(from)}
          </div>

          <div class="summary-row">
            <span class="label">📍 To:</span>
            ${escapeHtml(to)}
          </div>

          <div class="summary-row">
            <span class="label">👥 যাত্রী:</span>
            ${selectedRide.passengers} জন
          </div>

          <div class="summary-row">
            <span class="label">📅 তারিখ:</span>
            ${escapeHtml(selectedRide.date)}
          </div>

          <div class="summary-row">
            <span class="label">⏰ সময়:</span>
            ${escapeHtml(selectedRide.time)}
          </div>

          ${
            selectedRide.note
            ?
            `
            <div class="summary-row">
              <span class="label">📝 Note:</span>
              ${escapeHtml(selectedRide.note)}
            </div>
            `
            :
            ""
          }

          <div class="fare-box">
            💰 ভাড়া এখনো নির্ধারিত নয়
            <div class="small">
              Driver আপনার Pickup ও Destination দেখে
              ভাড়া পাঠাবেন।
            </div>
          </div>

        `;


        reviewSection.classList.remove(
          "hidden"
        );

        reviewSection.scrollIntoView({
          behavior: "smooth"
        });

      };


    // =====================================================
    // Edit
    // =====================================================

    editBtn.onclick =
      () => {

        reviewSection.classList.add(
          "hidden"
        );

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };


    // =====================================================
    // Send Booking Request
    // =====================================================

    confirmRequestBtn.onclick =
      async () => {

        if (!selectedRide) {

          alert(
            "Booking information পাওয়া যায়নি।"
          );

          return;

        }


        if (!currentUser) {

          alert(
            "Firebase connection নেই।"
          );

          return;

        }


        if (!validatePassenger()) {
          return;
        }


        confirmRequestBtn.disabled =
          true;

        confirmRequestBtn.textContent =
          "⏳ Booking পাঠানো হচ্ছে...";


        try {

          const rideData = {

            type:
              selectedRide.type,

            from:
              selectedRide.from,

            to:
              selectedRide.to,

            passengers:
              selectedRide.passengers,

            date:
              selectedRide.date,

            time:
              selectedRide.time,

            note:
              selectedRide.note,

            fare:
              0,

            originalFare:
              0,

            discountAmount:
              0,

            fareType:
              "driver_quote",

            fareStatus:
              "waiting",

            status:
              "searching",

            passengerId:
              currentUser.uid,

            passengerName:
              passengerName.value.trim(),

            passengerPhone:
              passengerPhone.value.trim(),

            driverId:
              "",

            driverName:
              "",

            driverPhone:
              "",

            autoNumber:
              "",

            createdAt:
              new Date()

          };


          const docRef =
            await addDoc(
              collection(
                db,
                "rides"
              ),
              rideData
            );


          currentRideId =
            docRef.id;


          reviewSection.classList.add(
            "hidden"
          );

          statusSection.classList.remove(
            "hidden"
          );


          showWaitingStatus();


          listenToRide(
            currentRideId
          );


        }

        catch (error) {

          console.error(
            "Booking Error:",
            error
          );


          alert(
            "Booking পাঠানো যাচ্ছে না।\n\n" +
            error.message
          );

        }

        finally {

          confirmRequestBtn.disabled =
            false;

          confirmRequestBtn.textContent =
            "🚕 Booking Request পাঠান";

        }

      };


    // =====================================================
    // Waiting Status
    // =====================================================

    function showWaitingStatus() {

      statusContent.innerHTML = `

        <div class="waiting">
          🔎 Driver-এর উত্তর অপেক্ষা করা হচ্ছে...
        </div>

        <div class="small">
          আপনার Pickup ও Destination Driver-এর কাছে
          পাঠানো হয়েছে। Driver ভাড়া পাঠালে এখানে দেখা যাবে।
        </div>

      `;

      fareArea.innerHTML = "";

      driverArea.innerHTML = "";

      locationArea.innerHTML = "";

    }


    // =====================================================
    // Listen to Booking
    // =====================================================

    function listenToRide(rideId) {

      if (unsubscribeRide) {

        unsubscribeRide();

      }


      unsubscribeRide =
        onSnapshot(

          doc(
            db,
            "rides",
            rideId
          ),

          snapshot => {

            if (!snapshot.exists()) {

              statusContent.innerHTML =
                `<div class="error">
                  ❌ Booking পাওয়া যাচ্ছে না।
                </div>`;

              return;

            }


            const ride =
              snapshot.data();


            showRideStatus(
              ride
            );

          },

          error => {

            console.error(
              "Ride Listener Error:",
              error
            );


            statusContent.innerHTML = `

              <div class="error">
                ❌ Booking status পড়তে সমস্যা হচ্ছে।
              </div>

            `;

          }

        );

    }


    // =====================================================
    // Show Ride Status
    // =====================================================

    function showRideStatus(ride) {

      const status =
        ride.status ||
        "searching";


      // ---------------------------------------------------
      // Searching
      // ---------------------------------------------------

      if (
        status === "searching"
      ) {

        statusContent.innerHTML = `

          <div class="waiting">
            🔎 Driver-এর উত্তর অপেক্ষা করা হচ্ছে...
          </div>

          <div class="small">
            📍 ${escapeHtml(ride.from || "")}
            →
            ${escapeHtml(ride.to || "")}
          </div>

        `;

      }


      // ---------------------------------------------------
      // Fare Sent
      // ---------------------------------------------------

      else if (
        status === "fare_sent"
      ) {

        statusContent.innerHTML = `

          <div class="waiting">
            💰 Driver ভাড়া পাঠিয়েছেন।
          </div>

          <div class="small">
            ভাড়া দেখে Accept করলে Booking Confirm হবে।
          </div>

        `;

      }


      // ---------------------------------------------------
      // Fare Accepted / Confirmed
      // ---------------------------------------------------

      else if (
        status === "confirmed"
        ||
        status === "fare_accepted"
      ) {

        statusContent.innerHTML = `

          <div class="success-text">
            ✅ Booking Confirmed
          </div>

          <div class="small">
            Driver আপনার booking গ্রহণ করেছেন।
          </div>

        `;

      }


      // ---------------------------------------------------
      // Started
      // ---------------------------------------------------

      else if (
        status === "started"
      ) {

        statusContent.innerHTML = `

          <div class="success-text">
            🚕 Ride Started
          </div>

          <div class="small">
            আপনার ride এখন চলছে।
          </div>

        `;

      }


      // ---------------------------------------------------
      // Completed
      // ---------------------------------------------------

      else if (
        status === "completed"
      ) {

        statusContent.innerHTML = `

          <div class="success-text">
            🏁 Ride Completed
          </div>

          <div class="small">
            আপনার ride সম্পূর্ণ হয়েছে।
          </div>

        `;

      }


      // ---------------------------------------------------
      // Cancelled
      // ---------------------------------------------------

      else if (
        status === "cancelled"
      ) {

        statusContent.innerHTML = `

          <div class="error">
            ❌ Booking Cancelled
          </div>

        `;

      }


      // ---------------------------------------------------
      // Fare
      // ---------------------------------------------------

      if (
        ride.fareStatus === "sent"
        ||
        ride.status === "fare_sent"
        ||
        ride.status === "confirmed"
        ||
        ride.status === "fare_accepted"
        ||
        ride.status === "started"
        ||
        ride.status === "completed"
      ) {

        if (
          Number(ride.fare) > 0
        ) {

          fareArea.innerHTML = `

            <div class="fare-box">

              <div>
                💰 Driver-এর ভাড়া
              </div>

              <div class="fare-price">
                ₹${Number(ride.fare)}
              </div>

              ${
                ride.status === "fare_sent"
                ?
                `
                <button
                  id="acceptFareBtn"
                  class="success">
                  ✅ এই ভাড়া গ্রহণ করুন
                </button>

                <button
                  id="rejectFareBtn"
                  class="secondary">
                  ❌ ভাড়া গ্রহণ করব না
                </button>
                `
                :
                `
                <div class="success-text">
                  ${
                    ride.status === "fare_sent"
                    ?
                    ""
                    :
                    "ভাড়া গ্রহণ করা হয়েছে"
                  }
                </div>
                `
              }

            </div>

          `;


          const acceptFareBtn =
            document.getElementById(
              "acceptFareBtn"
            );


          if (acceptFareBtn) {

            acceptFareBtn.onclick =
              () =>
                acceptFare(
                  currentRideId
                );

          }


          const rejectFareBtn =
            document.getElementById(
              "rejectFareBtn"
            );


          if (rejectFareBtn) {

            rejectFareBtn.onclick =
              () =>
                rejectFare(
                  currentRideId
                );

          }

        }

      }


      // ---------------------------------------------------
      // Driver Information
      // ---------------------------------------------------

      if (
        ride.driverName ||
        ride.autoNumber ||
        ride.driverPhone
      ) {

        driverArea.innerHTML = `

          <div class="card">

            <h2>🚕 Driver Information</h2>

            ${
              ride.driverName
              ?
              `
              <div class="summary-row">
                <span class="label">👤 Driver:</span>
                ${escapeHtml(ride.driverName)}
              </div>
              `
              :
              ""
            }

            ${
              ride.autoNumber
              ?
              `
              <div class="summary-row">
                <span class="label">🚖 Auto:</span>
                ${escapeHtml(ride.autoNumber)}
              </div>
              `
              :
              ""
            }

            ${
              ride.driverPhone
              ?
              `
              <button
                class="primary"
                onclick="window.location.href='tel:${escapeHtml(ride.driverPhone)}'">
                📞 Driver-কে Call
              </button>
              `
              :
              ""
            }

          </div>

        `;

      }
      else {

        driverArea.innerHTML = "";

      }


      // ---------------------------------------------------
      // Live Location
      // ---------------------------------------------------

      if (
        (
          status === "confirmed"
          ||
          status === "fare_accepted"
          ||
          status === "started"
        )
        &&
        ride.driverId
      ) {

        listenDriverLocation(
          ride.driverId
        );

      }
      else {

        if (unsubscribeLocation) {

          unsubscribeLocation();

          unsubscribeLocation =
            null;

        }

        locationArea.innerHTML = "";

      }


      // ---------------------------------------------------
      // Cancel Button
      // ---------------------------------------------------

      if (
        status === "completed"
        ||
        status === "cancelled"
      ) {

        cancelBtn.classList.add(
          "hidden"
        );

      }
      else {

        cancelBtn.classList.remove(
          "hidden"
        );

      }

    }


    // =====================================================
    // Accept Fare
    // =====================================================

    async function acceptFare(id) {

      if (!id) {
        return;
      }


      const ok =
        confirm(
          "আপনি কি Driver-এর ₹" +
          currentFare() +
          " ভাড়া গ্রহণ করছেন?"
        );


      if (!ok) {
        return;
      }


      try {

        await updateDoc(

          doc(
            db,
            "rides",
            id
          ),

          {

            status:
              "confirmed",

            fareStatus:
              "accepted",

            passengerFareAcceptedAt:
              new Date()

          }

        );


        alert(
          "✅ ভাড়া গ্রহণ করা হয়েছে। Booking Confirmed!"
        );

      }

      catch (error) {

        console.error(
          "Accept Fare Error:",
          error
        );

        alert(
          "ভাড়া Accept করা যাচ্ছে না।\n\n" +
          error.message
        );

      }

    }


    // =====================================================
    // Current Fare
    // =====================================================

    function currentFare() {

      const price =
        document.querySelector(
          ".fare-price"
        );

      if (!price) {
        return "";
      }

      return price.textContent
        .replace("₹", "")
        .trim();

    }


    // =====================================================
    // Reject Fare
    // =====================================================

    async function rejectFare(id) {

      const ok =
        confirm(
          "আপনি কি এই ভাড়া গ্রহণ করবেন না?"
        );


      if (!ok) {
        return;
      }


      try {

        await updateDoc(

          doc(
            db,
            "rides",
            id
          ),

          {

            status:
              "fare_rejected",

            fareStatus:
              "rejected",

            passengerFareAcceptedAt:
              null

          }

        );


        statusContent.innerHTML = `

          <div class="error">
            ❌ আপনি Driver-এর ভাড়া গ্রহণ করেননি।
          </div>

          <div class="small">
            নতুন ভাড়ার জন্য Driver-এর সঙ্গে যোগাযোগ করুন
            অথবা Booking বাতিল করুন।
          </div>

        `;

        fareArea.innerHTML = "";

      }

      catch (error) {

        console.error(
          "Reject Fare Error:",
          error
        );

        alert(
          "ভাড়া Reject করা যাচ্ছে না।\n\n" +
          error.message
        );

      }

    }


    // =====================================================
    // Live Driver Location
    // =====================================================

    function listenDriverLocation(
      driverId
    ) {

      if (unsubscribeLocation) {

        unsubscribeLocation();

        unsubscribeLocation =
          null;

      }


      const locationRef =
        ref(
          realtimeDb,
          "drivers/" +
          driverId +
          "/location"
        );


      unsubscribeLocation =
        onValue(

          locationRef,

          snapshot => {

            const data =
              snapshot.val();


            if (
              !data ||
              data.online !== true ||
              typeof data.lat !== "number" ||
              typeof data.lng !== "number"
            ) {

              locationArea.innerHTML = `

                <div class="location-box">

                  <b>
                    📍 Driver Live Location
                  </b>

                  <p class="small">
                    Driver-এর Live Location বর্তমানে বন্ধ আছে।
                  </p>

                </div>

              `;

              return;

            }


            const lat =
              data.lat;

            const lng =
              data.lng;


            const accuracy =
              data.accuracy ||
              "";


            locationArea.innerHTML = `

              <div class="location-box">

                <b>
                  🟢 Driver Live Location
                </b>

                <p class="small">
                  🚕 Driver এখন Live আছেন।
                </p>

                ${
                  accuracy
                  ?
                  `
                  <p class="small">
                    Location accuracy: ${accuracy} m
                  </p>
                  `
                  :
                  ""
                }

                <button
                  class="success"
                  id="mapBtn">
                  📍 Google Maps-এ Driver দেখুন
                </button>

              </div>

            `;


            const mapBtn =
              document.getElementById(
                "mapBtn"
              );


            if (mapBtn) {

              mapBtn.onclick =
                () => {

                  window.open(
                    "https://www.google.com/maps?q=" +
                    lat +
                    "," +
                    lng,
                    "_blank"
                  );

                };

            }

          },

          error => {

            console.error(
              "Location Error:",
              error
            );

            locationArea.innerHTML = `

              <div class="location-box">

                <b>
                  📍 Driver Live Location
                </b>

                <p class="small error">
                  Live Location পড়তে সমস্যা হচ্ছে।
                </p>

              </div>

            `;

          }

        );

    }


    // =====================================================
    // Cancel Booking
    // =====================================================

    cancelBtn.onclick =
      async () => {

        if (!currentRideId) {
          return;
        }


        const ok =
          confirm(
            "আপনি কি এই Booking বাতিল করতে চান?"
          );


        if (!ok) {
          return;
        }


        try {

          await updateDoc(

            doc(
              db,
              "rides",
              currentRideId
            ),

            {

              status:
                "cancelled",

              cancelledBy:
                "passenger",

              cancelledAt:
                new Date()

            }

          );


          alert(
            "❌ Booking বাতিল হয়েছে।"
          );

        }

        catch (error) {

          console.error(
            "Cancel Error:",
            error
          );


          alert(
            "Booking বাতিল করা যাচ্ছে না।\n\n" +
            error.message
          );

        }

      };


    // =====================================================
    // Firebase Anonymous Login
    // =====================================================

    signInAnonymously(auth)

      .catch(error => {

        console.error(
          "Anonymous Login Error:",
          error
        );


        alert(
          "Firebase Login হচ্ছে না।\n\n" +
          error.message
        );

      });


    // =====================================================
    // Auth State
    // =====================================================

    onAuthStateChanged(
      auth,
      user => {

        if (user) {

          currentUser =
            user;

        }

      }
    );

  </script>

</body>
</html>
