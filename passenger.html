<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nalhati Ride - Passenger</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    select, input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .type-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .type-btn {
      flex: 1;
      padding: 14px 8px;
      border: 2px solid #d1d5db;
      background: white;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
    }

    .type-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .main-btn:disabled {
      background: #9ca3af;
    }

    .call-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .driver-box {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: left;
      line-height: 1.8;
    }

    .summary {
      background: #f0fdf4;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .status-box {
      text-align: center;
    }

    .success {
      color: #15803d;
      font-size: 23px;
      font-weight: bold;
    }

    .booking-id {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 13px;
    }

    .cancel-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .hidden { display: none; }

    .price-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .distance-box {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚖 Nalhati Ride</h1>
    <p>Passenger App</p>
  </div>

  <div class="container">

    <div class="card" id="bookingCard">

      <h2>আপনি কীভাবে যাবেন?</h2>

      <div class="type-buttons">

        <button class="type-btn active" id="normalBtn">
          🚖 Normal Ride
        </button>

        <button class="type-btn" id="reserveBtn">
          🚕 Reserve Auto
        </button>

      </div>


      <!-- NORMAL RIDE -->

      <div id="normalForm">

        <label>📍 কোথা থেকে যাবেন?</label>

        <select id="normalFrom">

          <option value="">
            Pickup নির্বাচন করুন
          </option>

          <option value="Nalhati">
            Nalhati
          </option>

          <option value="Murarai">
            Murarai
          </option>

        </select>


        <label>🏁 কোথায় যাবেন?</label>

        <select id="normalTo">

          <option value="">
            Destination নির্বাচন করুন
          </option>

          <option value="Nalhati">
            Nalhati
          </option>

          <option value="Murarai">
            Murarai
          </option>

        </select>


        <div class="summary" style="margin-top:15px;">

          💰 ভাড়া:
          <strong>₹25</strong>

        </div>

      </div>


      <!-- RESERVE AUTO -->

      <div id="reserveForm" class="hidden">

        <label>📍 Pickup Location</label>

        <input
          type="text"
          id="reserveFrom"
          placeholder="যেখান থেকে গাড়ি নিতে চান"
        >


        <label>🏁 Destination</label>

        <input
          type="text"
          id="reserveTo"
          placeholder="যেখানে যেতে চান"
        >


        <label>📏 Distance</label>

        <div
          class="distance-box"
          id="distanceBox"
        >
          Pickup ও Destination লিখুন
        </div>


        <label>💰 প্রতি কিলোমিটার ভাড়া</label>

        <input
          type="number"
          id="ratePerKm"
          value="20"
          min="1"
        >

        <div class="price-note">
          বর্তমান হিসাব: ₹20 প্রতি কিলোমিটার
        </div>


        <div
          class="summary"
          style="margin-top:15px;"
        >

          💵 মোট আনুমানিক ভাড়া:
          <strong id="calculatedFare">
            ₹0
          </strong>

        </div>


        <label>👥 যাত্রী সংখ্যা</label>

        <select id="passengers">

          <option value="">
            যাত্রী সংখ্যা নির্বাচন করুন
          </option>

          <option value="1">1 জন</option>
          <option value="2">2 জন</option>
          <option value="3">3 জন</option>
          <option value="4">4 জন</option>
          <option value="5">5 জন</option>
          <option value="6">6 জন</option>
          <option value="7">7 জন</option>
          <option value="8">8 জন</option>

        </select>


        <label>📅 যাওয়ার তারিখ</label>

        <input
          type="date"
          id="reserveDate"
        >


        <label>⏰ যাওয়ার সময়</label>

        <input
          type="time"
          id="reserveTime"
        >


        <label>📝 অতিরিক্ত কথা (ঐচ্ছিক)</label>

        <textarea
          id="reserveNote"
          placeholder="যেমন: ফেরার সময় অপেক্ষা করতে হবে"
        ></textarea>

      </div>


      <button
        class="main-btn"
        id="reviewBtn"
      >
        বুকিংয়ের তথ্য দেখুন
      </button>

    </div>


    <!-- SUMMARY -->

    <div
      class="card hidden"
      id="summaryCard"
    >

      <h2>📋 Booking Summary</h2>

      <div
        class="summary"
        id="summaryText"
      ></div>


      <button
        class="main-btn"
        id="confirmBtn"
      >
        ✅ Confirm Booking
      </button>


      <button
        class="main-btn"
        id="editBtn"
        style="background:#6b7280;"
      >
        ✏️ Edit
      </button>

    </div>


    <!-- STATUS -->

    <div
      class="card hidden"
      id="statusCard"
    >

      <div class="status-box">

        <div
          class="success"
          id="statusTitle"
        >
          Booking Confirmed!
        </div>


        <p id="statusMessage">
          আপনার বুকিং নেওয়া হয়েছে।
        </p>


        <div id="statusDetails"></div>


        <p>
          <strong>Booking ID</strong>
        </p>


        <div
          class="booking-id"
          id="bookingId"
        ></div>


        <button
          class="cancel-btn"
          id="cancelBtn"
        >
          ❌ Booking Cancel করুন
        </button>

      </div>

    </div>

  </div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  updateDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

  authDomain:
    "nalhati-ride.firebaseapp.com",

  projectId:
    "nalhati-ride",

  storageBucket:
    "nalhati-ride.firebasestorage.app",

  messagingSenderId:
    "1077953215118",

  appId:
    "1:1077953215118:web:7d73eac073d30523dda7df",

  measurementId:
    "G-BPZT7JKDH7"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


let currentUser = null;

let currentRideId = null;

let unsubscribeRide = null;

let bookingType = "normal";

let reserveDistanceKm = 0;

let reserveFare = 0;


signInAnonymously(auth);


onAuthStateChanged(
  auth,
  (user) => {

    if (user) {
      currentUser = user;
    }

  }
);


/* ELEMENTS */

const normalBtn =
  document.getElementById("normalBtn");

const reserveBtn =
  document.getElementById("reserveBtn");

const normalForm =
  document.getElementById("normalForm");

const reserveForm =
  document.getElementById("reserveForm");

const bookingCard =
  document.getElementById("bookingCard");

const summaryCard =
  document.getElementById("summaryCard");

const statusCard =
  document.getElementById("statusCard");

const reviewBtn =
  document.getElementById("reviewBtn");

const confirmBtn =
  document.getElementById("confirmBtn");

const editBtn =
  document.getElementById("editBtn");

const summaryText =
  document.getElementById("summaryText");

const statusTitle =
  document.getElementById("statusTitle");

const statusMessage =
  document.getElementById("statusMessage");

const statusDetails =
  document.getElementById("statusDetails");

const bookingId =
  document.getElementById("bookingId");

const cancelBtn =
  document.getElementById("cancelBtn");

const reserveFrom =
  document.getElementById("reserveFrom");

const reserveTo =
  document.getElementById("reserveTo");

const ratePerKm =
  document.getElementById("ratePerKm");

const distanceBox =
  document.getElementById("distanceBox");

const calculatedFare =
  document.getElementById("calculatedFare");


/* NORMAL */

normalBtn.addEventListener(
  "click",
  () => {

    bookingType = "normal";

    normalBtn.classList.add("active");

    reserveBtn.classList.remove("active");

    normalForm.classList.remove("hidden");

    reserveForm.classList.add("hidden");

  }
);


/* RESERVE */

reserveBtn.addEventListener(
  "click",
  () => {

    bookingType = "reserve";

    reserveBtn.classList.add("active");

    normalBtn.classList.remove("active");

    normalForm.classList.add("hidden");

    reserveForm.classList.remove("hidden");

  }
);


/* DISTANCE */

async function calculateDistance() {

  const from =
    reserveFrom.value.trim();

  const to =
    reserveTo.value.trim();


  if (!from || !to) {

    distanceBox.innerText =
      "Pickup ও Destination লিখুন";

    calculatedFare.innerText =
      "₹0";

    reserveDistanceKm = 0;

    reserveFare = 0;

    return;

  }


  distanceBox.innerText =
    "📍 Distance হিসাব হচ্ছে...";


  try {

    const fromURL =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(
        from + ", West Bengal, India"
      );


    const toURL =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(
        to + ", West Bengal, India"
      );


    const fromResponse =
      await fetch(fromURL);

    const fromData =
      await fromResponse.json();


    const toResponse =
      await fetch(toURL);

    const toData =
      await toResponse.json();


    if (
      !fromData.length ||
      !toData.length
    ) {

      distanceBox.innerText =
        "⚠️ Location পাওয়া যায়নি";

      calculatedFare.innerText =
        "₹0";

      return;

    }


    const fromLat =
      fromData[0].lat;

    const fromLon =
      fromData[0].lon;

    const toLat =
      toData[0].lat;

    const toLon =
      toData[0].lon;


    const routeURL =
      "https://router.project-osrm.org/route/v1/driving/" +
      fromLon + "," + fromLat +
      ";" +
      toLon + "," + toLat +
      "?overview=false";


    const routeResponse =
      await fetch(routeURL);

    const routeData =
      await routeResponse.json();


    if (
      !routeData.routes ||
      !routeData.routes.length
    ) {

      distanceBox.innerText =
        "⚠️ রাস্তার Distance পাওয়া যায়নি";

      calculatedFare.innerText =
        "₹0";

      return;

    }


    reserveDistanceKm =
      routeData.routes[0].distance / 1000;


    reserveDistanceKm =
      Math.ceil(
        reserveDistanceKm * 10
      ) / 10;


    calculateFare();


  } catch (error) {

    console.error(error);

    distanceBox.innerText =
      "⚠️ Distance হিসাব করা যায়নি";

    calculatedFare.innerText =
      "₹0";

  }

}


function calculateFare() {

  const rate =
    Number(ratePerKm.value) || 20;


  reserveFare =
    Math.ceil(
      reserveDistanceKm * rate
    );


  distanceBox.innerHTML =
    "📏 <strong>" +
    reserveDistanceKm +
    " km</strong>";


  calculatedFare.innerText =
    "₹" + reserveFare;

}


reserveFrom.addEventListener(
  "change",
  calculateDistance
);

reserveTo.addEventListener(
  "change",
  calculateDistance
);

ratePerKm.addEventListener(
  "input",
  calculateFare
);


/* REVIEW */

reviewBtn.addEventListener(
  "click",
  () => {

    let html = "";


    if (bookingType === "normal") {

      const from =
        document.getElementById(
          "normalFrom"
        ).value;

      const to =
        document.getElementById(
          "normalTo"
        ).value;


      if (!from || !to) {

        alert(
          "Pickup এবং Destination নির্বাচন করুন।"
        );

        return;

      }


      if (from === to) {

        alert(
          "Pickup এবং Destination আলাদা হতে হবে।"
        );

        return;

      }


      html = `

        🚖 <strong>Normal Ride</strong>
        <br><br>

        📍 Pickup:
        <strong>${escapeHtml(from)}</strong>
        <br>

        🏁 Destination:
        <strong>${escapeHtml(to)}</strong>
        <br>

        💰 ভাড়া:
        <strong>₹25</strong>

      `;

    } else {

      const from =
        reserveFrom.value.trim();

      const to =
        reserveTo.value.trim();

      const passengers =
        document.getElementById(
          "passengers"
        ).value;

      const date =
        document.getElementById(
          "reserveDate"
        ).value;

      const time =
        document.getElementById(
          "reserveTime"
        ).value;

      const note =
        document.getElementById(
          "reserveNote"
        ).value.trim();


      if (!from || !to) {

        alert(
          "Pickup এবং Destination লিখুন।"
        );

        return;

      }


      if (!reserveDistanceKm) {

        alert(
          "আগে Distance হিসাব হতে দিন।"
        );

        calculateDistance();

        return;

      }


      if (!passengers) {

        alert(
          "যাত্রী সংখ্যা নির্বাচন করুন।"
        );

        return;

      }


      if (!date) {

        alert(
          "তারিখ নির্বাচন করুন।"
        );

        return;

      }


      if (!time) {

        alert(
          "সময় নির্বাচন করুন।"
        );

        return;

      }


      html = `

        🚕 <strong>Reserve Auto</strong>
        <br><br>

        📍 Pickup:
        <strong>${escapeHtml(from)}</strong>
        <br>

        🏁 Destination:
        <strong>${escapeHtml(to)}</strong>
        <br>

        📏 Distance:
        <strong>${reserveDistanceKm} km</strong>
        <br>

        💰 Rate:
        <strong>₹${ratePerKm.value}/km</strong>
        <br>

        💵 মোট ভাড়া:
        <strong>₹${reserveFare}</strong>
        <br>

        👥 যাত্রী:
        <strong>${passengers} জন</strong>
        <br>

        📅 তারিখ:
        <strong>${date}</strong>
        <br>

        ⏰ সময়:
        <strong>${time}</strong>
        <br>

        ${
          note
            ? "📝 Note: <strong>" +
              escapeHtml(note) +
              "</strong>"
            : ""
        }

      `;

    }


    summaryText.innerHTML =
      html;

    bookingCard.classList.add(
      "hidden"
    );

    summaryCard.classList.remove(
      "hidden"
    );

  }
);


/* EDIT */

editBtn.addEventListener(
  "click",
  () => {

    summaryCard.classList.add(
      "hidden"
    );

    bookingCard.classList.remove(
      "hidden"
    );

  }
);


/* CONFIRM */

confirmBtn.addEventListener(
  "click",
  async () => {

    if (!currentUser) {

      alert(
        "অ্যাপ প্রস্তুত হচ্ছে। একটু পরে চেষ্টা করুন।"
      );

      return;

    }


    confirmBtn.disabled = true;

    confirmBtn.innerText =
      "Booking হচ্ছে...";


    try {

      let rideData;


      if (bookingType === "normal") {

        const from =
          document.getElementById(
            "normalFrom"
          ).value;

        const to =
          document.getElementById(
            "normalTo"
          ).value;


        rideData = {

          type: "normal",

          from: from,

          to: to,

          passengers: 1,

          fare: 25,

          fareType: "fixed",

          distanceKm: 0,

          ratePerKm: 0,

          date: "",

          time: "",

          note: "",

          status: "searching",

          passengerId:
            currentUser.uid,

          driverId: "",

          driverName: "",

          driverPhone: "",

          autoNumber: "",

          createdAt:
            new Date()

        };

      } else {

        const from =
          reserveFrom.value.trim();

        const to =
          reserveTo.value.trim();

        const passengers =
          Number(
            document.getElementById(
              "passengers"
            ).value
          );

        const date =
          document.getElementById(
            "reserveDate"
          ).value;

        const time =
          document.getElementById(
            "reserveTime"
          ).value;

        const note =
          document.getElementById(
            "reserveNote"
          ).value.trim();

        const rate =
          Number(
            ratePerKm.value
          ) || 20;


        rideData = {

          type: "reserve",

          from: from,

          to: to,

          passengers: passengers,

          distanceKm:
            reserveDistanceKm,

          ratePerKm: rate,

          fare: reserveFare,

          fareType: "per_km",

          date: date,

          time: time,

          note: note,

          status: "searching",

          passengerId:
            currentUser.uid,

          driverId: "",

          driverName: "",

          driverPhone: "",

          autoNumber: "",

          createdAt:
            new Date()

        };

      }


      const docRef =
        await addDoc(
          collection(
            db,
            "rides"
          ),
          rideData
        );


      currentRideId =
        docRef.id;


      bookingId.innerText =
        currentRideId;


      summaryCard.classList.add(
        "hidden"
      );

      statusCard.classList.remove(
        "hidden"
      );


      updateStatusUI(
        rideData
      );


      unsubscribeRide =
        onSnapshot(
          doc(
            db,
            "rides",
            currentRideId
          ),
          (snapshot) => {

            if (!snapshot.exists()) {
              return;
            }


            updateStatusUI(
              snapshot.data()
            );

          }
        );


    } catch (error) {

      console.error(error);

      alert(
        "Booking করতে সমস্যা হয়েছে: " +
        error.message
      );

      confirmBtn.disabled = false;

      confirmBtn.innerText =
        "✅ Confirm Booking";

    }

  }
);


/* STATUS */

function updateStatusUI(ride) {

  if (ride.type === "reserve") {

    statusDetails.innerHTML = `

      <div class="summary">

        🚕 <strong>Reserve Auto</strong>
        <br><br>

        📍 ${escapeHtml(ride.from)}
        <br>

        🏁 ${escapeHtml(ride.to)}
        <br>

        📏 ${ride.distanceKm || 0} km
        <br>

        💰 ₹${ride.fare || 0}
        <br>

        👥 ${ride.passengers || 1} জন
        <br>

        📅 ${ride.date || "-"}
        <br>

        ⏰ ${ride.time || "-"}

      </div>

    `;

  } else {

    statusDetails.innerHTML = `

      <div class="summary">

        🚖 Normal Ride
        <br><br>

        📍 ${escapeHtml(ride.from)}
        <br>

        🏁 ${escapeHtml(ride.to)}
        <br>

        💰 ₹${ride.fare}

      </div>

    `;

  }


  /* SEARCHING */

  if (ride.status === "searching") {

    statusTitle.innerText =
      "Booking Confirmed!";

    statusMessage.innerText =
      ride.type === "reserve"
        ? "Reserve Booking নেওয়া হয়েছে। Driver খোঁজা হচ্ছে..."
        : "আপনার বুকিং নেওয়া হয়েছে। Driver খোঁজা হচ্ছে...";

  }


  /* ACCEPTED */

  else if (ride.status === "accepted") {

    statusTitle.innerText =
      "🚕 Driver পাওয়া গেছে!";

    statusMessage.innerText =
      "Driver আপনার Booking Accept করেছেন।";


    const driverName =
      ride.driverName || "Driver";

    const driverPhone =
      ride.driverPhone || "";

    const autoNumber =
      ride.autoNumber || "নম্বর দেওয়া হয়নি";


    let phoneButton = "";


    if (driverPhone) {

      phoneButton = `

        <a
          class="call-btn"
          href="tel:${escapeHtml(driverPhone)}"
        >
          📞 Driver-কে Call করুন
        </a>

      `;

    } else {

      phoneButton = `

        <div
          class="driver-box"
          style="background:#fff7ed;border-color:#fdba74;"
        >
          ⚠️ Driver-এর ফোন নম্বর পাওয়া যায়নি।
        </div>

      `;

    }


    statusDetails.innerHTML += `

      <div class="driver-box">

        🚕 <strong>Driver Information</strong>
        <br><br>

        👤 Driver Name:
        <strong>${escapeHtml(driverName)}</strong>
        <br>

        🚗 Auto Number:
        <strong>${escapeHtml(autoNumber)}</strong>

        ${phoneButton}

      </div>

    `;

  }


  /* STARTED */

  else if (ride.status === "started") {

    statusTitle.innerText =
      "🚗 Ride Started";

    statusMessage.innerText =
      "আপনার যাত্রা শুরু হয়েছে।";


    if (ride.driverName || ride.autoNumber) {

      addDriverInfo(ride);

    }

  }


  /* COMPLETED */

  else if (ride.status === "completed") {

    statusTitle.innerText =
      "✅ Ride Completed";

    statusMessage.innerText =
      "আপনার যাত্রা সম্পূর্ণ হয়েছে।";

    cancelBtn.classList.add(
      "hidden"
    );


    if (ride.driverName || ride.autoNumber) {

      addDriverInfo(ride);

    }

  }


  /* CANCELLED */

  else if (ride.status === "cancelled") {

    statusTitle.innerText =
      "❌ Booking Cancelled";

    statusMessage.innerText =
      "এই Booking বাতিল করা হয়েছে।";

    cancelBtn.classList.add(
      "hidden"
    );

  }

}


/* DRIVER INFORMATION */

function addDriverInfo(ride) {

  const oldDriver =
    document.getElementById(
      "driverInfoBox"
    );

  if (oldDriver) {
    oldDriver.remove();
  }


  const driverName =
    ride.driverName || "Driver";

  const driverPhone =
    ride.driverPhone || "";

  const autoNumber =
    ride.autoNumber ||
    "নম্বর দেওয়া হয়নি";


  let phoneButton = "";


  if (driverPhone) {

    phoneButton = `

      <a
        class="call-btn"
        href="tel:${escapeHtml(driverPhone)}"
      >
        📞 Driver-কে Call করুন
      </a>

    `;

  }


  const box =
    document.createElement(
      "div"
    );


  box.id =
    "driverInfoBox";

  box.className =
    "driver-box";


  box.innerHTML = `

    🚕 <strong>Driver Information</strong>
    <br><br>

    👤 Driver Name:
    <strong>${escapeHtml(driverName)}</strong>
    <br>

    🚗 Auto Number:
    <strong>${escapeHtml(autoNumber)}</strong>

    ${phoneButton}

  `;


  statusDetails.appendChild(
    box
  );

}


/* CANCEL */

cancelBtn.addEventListener(
  "click",
  async () => {

    if (!currentRideId) {
      return;
    }


    if (
      !confirm(
        "আপনি কি সত্যিই Booking Cancel করতে চান?"
      )
    ) {

      return;

    }


    try {

      await updateDoc(
        doc(
          db,
          "rides",
          currentRideId
        ),
        {
          status: "cancelled"
        }
      );


      cancelBtn.classList.add(
        "hidden"
      );

    } catch (error) {

      alert(
        "Cancel করতে সমস্যা হয়েছে।"
      );

    }

  }
);


/* SECURITY */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>
