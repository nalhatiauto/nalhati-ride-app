<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride - Passenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 15px;
    }

    .header {
      background: #2196f3;
      color: white;
      padding: 20px 15px;
      margin: -15px -15px 15px -15px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      opacity: .9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #2196f3;
      color: white;
    }

    .success {
      background: #4caf50;
      color: white;
    }

    .danger {
      background: #d32f2f;
      color: white;
    }

    .secondary {
      background: #757575;
      color: white;
    }

    .warning {
      background: #ff9800;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .summary-row {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.5;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
    }

    .fare-box {
      background: #e8f5e9;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      margin-top: 12px;
    }

    .fare-price {
      font-size: 30px;
      font-weight: bold;
      color: #2e7d32;
      margin: 8px 0;
    }

    .status-box {
      background: #e3f2fd;
      border-left: 5px solid #2196f3;
      padding: 15px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .location-box {
      background: #f1f8e9;
      border-left: 5px solid #4caf50;
      padding: 15px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .small {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .success-text {
      color: #2e7d32;
      font-weight: bold;
    }

    .waiting {
      color: #ef6c00;
      font-weight: bold;
    }

    .booking-card {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
    }

    .booking-number {
      background: #2196f3;
      color: white;
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .route-box {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 9px;
      margin-top: 10px;
    }

    .new-booking-title {
      text-align: center;
      color: #1976d2;
      margin-bottom: 5px;
    }

    .empty-booking {
      text-align: center;
      color: #777;
      padding: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚕 Nalhati Ride</h1>
    <p>Passenger App</p>
  </div>


  <!-- Passenger Information -->

  <div class="card">

    <h2>👤 Passenger Information</h2>

    <label for="passengerName">
      নাম
    </label>

    <input
      id="passengerName"
      type="text"
      maxlength="50"
      placeholder="আপনার নাম"
    >

    <label for="passengerPhone">
      ফোন নম্বর
    </label>

    <input
      id="passengerPhone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="১০ সংখ্যার ফোন নম্বর"
    >

    <p class="small">
      Booking-এর জন্য নাম ও ফোন নম্বর প্রয়োজন।
    </p>

  </div>


  <!-- CURRENT BOOKINGS -->

  <div class="card">

    <h2>📌 আমার Booking</h2>

    <div id="bookingsList">

      <div class="empty-booking">
        Booking খোঁজা হচ্ছে...
      </div>

    </div>

  </div>


  <!-- NEW BOOKING FORM -->

  <div class="card">

    <h2 class="new-booking-title">
      ➕ নতুন Booking করুন
    </h2>

    <p class="small" style="text-align:center;">
      আগের Booking থাকলেও আপনি নতুন Booking করতে পারবেন।
    </p>


    <label for="pickup">
      📍 কোথা থেকে যাবেন?
    </label>

    <input
      id="pickup"
      type="text"
      maxlength="200"
      placeholder="Pickup address লিখুন"
    >


    <label for="destination">
      📍 কোথায় যাবেন?
    </label>

    <input
      id="destination"
      type="text"
      maxlength="200"
      placeholder="Destination address লিখুন"
    >


    <label for="passengers">
      👥 যাত্রী সংখ্যা
    </label>

    <select id="passengers">
      <option value="1">1 জন</option>
      <option value="2">2 জন</option>
      <option value="3">3 জন</option>
      <option value="4">4 জন</option>
      <option value="5">5 জন</option>
      <option value="6">6 জন</option>
      <option value="7">7 জন</option>
      <option value="8">8 জন</option>
    </select>


    <label for="rideDate">
      📅 তারিখ
    </label>

    <input
      id="rideDate"
      type="date"
    >


    <label for="rideTime">
      ⏰ সময়
    </label>

    <input
      id="rideTime"
      type="time"
    >


    <label for="rideNote">
      📝 অতিরিক্ত তথ্য
    </label>

    <textarea
      id="rideNote"
      maxlength="500"
      placeholder="প্রয়োজনে কিছু লিখুন"
    ></textarea>


    <button
      id="reviewBtn"
      class="primary"
    >
      👀 Booking Review
    </button>

  </div>


  <!-- REVIEW -->

  <div
    id="reviewSection"
    class="card hidden"
  >

    <h2>📋 Booking Review</h2>

    <div id="reviewContent"></div>

    <button
      id="confirmRequestBtn"
      class="success"
    >
      🚕 Booking Request পাঠান
    </button>

    <button
      id="editBtn"
      class="secondary"
    >
      ✏️ Edit
    </button>

  </div>


<script type="module">

  // =====================================================
  // FIREBASE IMPORTS
  // =====================================================

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    updateDoc,
    onSnapshot
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  import {
    getDatabase,
    ref,
    onValue
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  // =====================================================
  // FIREBASE CONFIG
  // =====================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

    authDomain:
      "nalhati-ride.firebaseapp.com",

    databaseURL:
      "https://nalhati-ride-default-rtdb.firebaseio.com",

    projectId:
      "nalhati-ride",

    storageBucket:
      "nalhati-ride.firebasestorage.app",

    messagingSenderId:
      "1077953215118",

    appId:
      "1:1077953215118:web:7d73eac073d30523dda7df",

    measurementId:
      "G-BPZT7JKDH7"

  };


  // =====================================================
  // FIREBASE START
  // =====================================================

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);

  const realtimeDb =
    getDatabase(app);


  // =====================================================
  // ELEMENTS
  // =====================================================

  const passengerName =
    document.getElementById(
      "passengerName"
    );

  const passengerPhone =
    document.getElementById(
      "passengerPhone"
    );

  const pickup =
    document.getElementById(
      "pickup"
    );

  const destination =
    document.getElementById(
      "destination"
    );

  const passengers =
    document.getElementById(
      "passengers"
    );

  const rideDate =
    document.getElementById(
      "rideDate"
    );

  const rideTime =
    document.getElementById(
      "rideTime"
    );

  const rideNote =
    document.getElementById(
      "rideNote"
    );

  const reviewBtn =
    document.getElementById(
      "reviewBtn"
    );

  const reviewSection =
    document.getElementById(
      "reviewSection"
    );

  const reviewContent =
    document.getElementById(
      "reviewContent"
    );

  const confirmRequestBtn =
    document.getElementById(
      "confirmRequestBtn"
    );

  const editBtn =
    document.getElementById(
      "editBtn"
    );

  const bookingsList =
    document.getElementById(
      "bookingsList"
    );


  // =====================================================
  // STATE
  // =====================================================

  let currentUser = null;

  let selectedRide = null;

  let unsubscribeBookings = null;

  /*
    প্রতিটি Booking-এর Live Location listener
    আলাদা করে রাখা হবে।
  */

  const locationListeners =
    new Map();


  // =====================================================
  // TODAY
  // =====================================================

  const today =
    new Date()
      .toISOString()
      .split("T")[0];

  rideDate.min = today;


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // =====================================================
  // PHONE INPUT
  // =====================================================

  passengerPhone.addEventListener(
    "input",
    () => {

      passengerPhone.value =
        passengerPhone.value
          .replace(/\D/g, "")
          .slice(0, 10);

    }
  );


  // =====================================================
  // VALIDATE PASSENGER
  // =====================================================

  function validatePassenger() {

    const name =
      passengerName.value.trim();

    const phone =
      passengerPhone.value.trim();


    if (!name) {

      alert(
        "আপনার নাম লিখুন।"
      );

      passengerName.focus();

      return false;

    }


    if (!/^\d{10}$/.test(phone)) {

      alert(
        "সঠিক ১০ সংখ্যার ফোন নম্বর লিখুন।"
      );

      passengerPhone.focus();

      return false;

    }


    return true;

  }


  // =====================================================
  // REVIEW
  // =====================================================

  reviewBtn.onclick =
    () => {

      if (!validatePassenger()) {
        return;
      }


      const from =
        pickup.value.trim();

      const to =
        destination.value.trim();


      if (!from) {

        alert(
          "Pickup address লিখুন।"
        );

        pickup.focus();

        return;

      }


      if (!to) {

        alert(
          "Destination address লিখুন।"
        );

        destination.focus();

        return;

      }


      if (
        from.toLowerCase() ===
        to.toLowerCase()
      ) {

        alert(
          "Pickup এবং Destination একই হতে পারবে না।"
        );

        return;

      }


      if (!rideDate.value) {

        alert(
          "তারিখ নির্বাচন করুন।"
        );

        rideDate.focus();

        return;

      }


      if (!rideTime.value) {

        alert(
          "সময় নির্বাচন করুন।"
        );

        rideTime.focus();

        return;

      }


      if (!currentUser) {

        alert(
          "Firebase connection হচ্ছে। একটু পরে চেষ্টা করুন।"
        );

        return;

      }


      selectedRide = {

        type:
          "booking",

        from:
          from,

        to:
          to,

        passengers:
          Number(
            passengers.value
          ),

        date:
          rideDate.value,

        time:
          rideTime.value,

        note:
          rideNote.value.trim()

      };


      reviewContent.innerHTML = `

        <div class="summary-row">
          <span class="label">👤 নাম:</span>
          ${escapeHtml(
            passengerName.value.trim()
          )}
        </div>

        <div class="summary-row">
          <span class="label">📞 ফোন:</span>
          ${escapeHtml(
            passengerPhone.value.trim()
          )}
        </div>

        <div class="summary-row">
          <span class="label">📍 From:</span>
          ${escapeHtml(from)}
        </div>

        <div class="summary-row">
          <span class="label">📍 To:</span>
          ${escapeHtml(to)}
        </div>

        <div class="summary-row">
          <span class="label">👥 যাত্রী:</span>
          ${selectedRide.passengers} জন
        </div>

        <div class="summary-row">
          <span class="label">📅 তারিখ:</span>
          ${escapeHtml(
            selectedRide.date
          )}
        </div>

        <div class="summary-row">
          <span class="label">⏰ সময়:</span>
          ${escapeHtml(
            selectedRide.time
          )}
        </div>

        ${
          selectedRide.note
          ?
          `
          <div class="summary-row">
            <span class="label">📝 Note:</span>
            ${escapeHtml(
              selectedRide.note
            )}
          </div>
          `
          :
          ""
        }

        <div class="fare-box">

          💰 ভাড়া এখনো নির্ধারিত নয়

          <div class="small">
            Driver আপনার Pickup ও Destination দেখে
            ভাড়া পাঠাবেন।
          </div>

        </div>

      `;


      reviewSection.classList.remove(
        "hidden"
      );


      reviewSection.scrollIntoView({
        behavior: "smooth"
      });

    };


  // =====================================================
  // EDIT
  // =====================================================

  editBtn.onclick =
    () => {

      reviewSection.classList.add(
        "hidden"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  // =====================================================
  // SEND NEW BOOKING
  // =====================================================

  confirmRequestBtn.onclick =
    async () => {

      if (!selectedRide) {

        alert(
          "Booking information পাওয়া যায়নি।"
        );

        return;

      }


      if (!currentUser) {

        alert(
          "Firebase connection নেই।"
        );

        return;

      }


      if (!validatePassenger()) {
        return;
      }


      confirmRequestBtn.disabled =
        true;

      confirmRequestBtn.textContent =
        "⏳ Booking পাঠানো হচ্ছে...";


      try {

        await addDoc(

          collection(
            db,
            "rides"
          ),

          {

            type:
              "booking",

            from:
              selectedRide.from,

            to:
              selectedRide.to,

            passengers:
              selectedRide.passengers,

            date:
              selectedRide.date,

            time:
              selectedRide.time,

            note:
              selectedRide.note,

            fare:
              0,

            originalFare:
              0,

            discountAmount:
              0,

            fareType:
              "driver_quote",

            fareStatus:
              "waiting",

            status:
              "searching",

            passengerId:
              currentUser.uid,

            passengerName:
              passengerName.value.trim(),

            passengerPhone:
              passengerPhone.value.trim(),

            driverId:
              "",

            driverName:
              "",

            driverPhone:
              "",

            autoNumber:
              "",

            createdAt:
              new Date()

          }

        );


        /*
          Booking তৈরি হয়ে গেছে।
          এখন Review বন্ধ করে নতুন Booking form
          পরিষ্কার করে আবার ব্যবহার করা যাবে।
        */

        reviewSection.classList.add(
          "hidden"
        );


        clearBookingForm();


        alert(
          "✅ Booking Request পাঠানো হয়েছে।"
        );


        /*
          Booking list-এ Firebase listener
          নিজে থেকেই নতুন Booking দেখাবে।
        */

        document
          .getElementById(
            "bookingsList"
          )
          .scrollIntoView({
            behavior: "smooth"
          });

      }

      catch (error) {

        console.error(
          "Booking Error:",
          error
        );


        alert(
          "Booking পাঠানো যাচ্ছে না।\n\n" +
          error.message
        );

      }

      finally {

        confirmRequestBtn.disabled =
          false;

        confirmRequestBtn.textContent =
          "🚕 Booking Request পাঠান";

      }

    };


  // =====================================================
  // CLEAR NEW BOOKING FORM
  // =====================================================

  function clearBookingForm() {

    pickup.value = "";

    destination.value = "";

    passengers.value = "1";

    rideDate.value = "";

    rideTime.value = "";

    rideNote.value = "";

    selectedRide = null;

  }


  // =====================================================
  // LISTEN TO ALL PASSENGER BOOKINGS
  // =====================================================

  function listenToAllBookings() {

    if (unsubscribeBookings) {

      unsubscribeBookings();

    }


    unsubscribeBookings =
      onSnapshot(

        collection(
          db,
          "rides"
        ),

        snapshot => {

          const rides = [];


          snapshot.forEach(
            rideDoc => {

              const data =
                rideDoc.data();


              /*
                শুধু এই Passenger-এর Booking।
              */

              if (
                data.passengerId ===
                currentUser.uid
              ) {

                /*
                  IMPORTANT:

                  Driver Complete করলে status
                  "completed" হবে।

                  তখন Booking Passenger App-এ
                  আর দেখানো হবে না।

                  Cancelled Booking-ও সরিয়ে দেওয়া হচ্ছে।
                */

                if (
                  data.status !==
                  "completed"
                  &&
                  data.status !==
                  "cancelled"
                ) {

                  rides.push({

                    id:
                      rideDoc.id,

                    ...data

                  });

                }

              }

            }
          );


          /*
            নতুন Booking আগে দেখাবে।
          */

          rides.sort(
            (a, b) => {

              const aTime =
                a.createdAt?.toMillis
                  ?
                  a.createdAt.toMillis()
                  :
                  0;

              const bTime =
                b.createdAt?.toMillis
                  ?
                  b.createdAt.toMillis()
                  :
                  0;

              return bTime - aTime;

            }
          );


          renderAllBookings(
            rides
          );

        },

        error => {

          console.error(
            "Bookings Error:",
            error
          );


          bookingsList.innerHTML = `

            <div class="error">
              ❌ Booking load করতে সমস্যা হচ্ছে।
            </div>

          `;

        }

      );

  }


  // =====================================================
  // RENDER ALL BOOKINGS
  // =====================================================

  function renderAllBookings(
    rides
  ) {

    /*
      যেসব Location listener আর দরকার নেই
      সেগুলো বন্ধ করা।
    */

    const currentIds =
      new Set(
        rides.map(
          ride => ride.id
        )
      );


    for (
      const [rideId, unsubscribe]
      of locationListeners
    ) {

      if (
        !currentIds.has(rideId)
      ) {

        unsubscribe();

        locationListeners.delete(
          rideId
        );

      }

    }


    if (!rides.length) {

      bookingsList.innerHTML = `

        <div class="empty-booking">

          এখন কোনো চলমান Booking নেই।

          <br><br>

          নিচের
          <b>➕ নতুন Booking করুন</b>
          দিয়ে Booking করতে পারেন।

        </div>

      `;

      return;

    }


    bookingsList.innerHTML = "";


    rides.forEach(
      (ride, index) => {

        const card =
          createBookingCard(
            ride,
            index + 1
          );


        bookingsList.appendChild(
          card
        );

      }
    );

  }


  // =====================================================
  // CREATE BOOKING CARD
  // =====================================================

  function createBookingCard(
    ride,
    bookingNumber
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "booking-card";


    card.innerHTML = `

      <div class="booking-number">
        Booking ${bookingNumber}
      </div>

      <h3>
        🚕 ${escapeHtml(
          ride.from || ""
        )}
        →
        ${escapeHtml(
          ride.to || ""
        )}
      </h3>

      <div class="summary-row">

        <span class="label">
          👥 যাত্রী:
        </span>

        ${ride.passengers || 1} জন

      </div>


      <div class="summary-row">

        <span class="label">
          📅 তারিখ:
        </span>

        ${escapeHtml(
          ride.date || ""
        )}

      </div>


      <div class="summary-row">

        <span class="label">
          ⏰ সময়:
        </span>

        ${escapeHtml(
          ride.time || ""
        )}

      </div>


      ${
        ride.note
        ?
        `
        <div class="summary-row">

          <span class="label">
            📝 Note:
          </span>

          ${escapeHtml(
            ride.note
          )}

        </div>
        `
        :
        ""
      }


      <div
        class="status-box"
        id="status-${ride.id}">
      </div>


      <div
        id="fare-${ride.id}">
      </div>


      <div
        id="driver-${ride.id}">
      </div>


      <div
        id="location-${ride.id}">
      </div>


      <button
        id="cancel-${ride.id}"
        class="danger">
        ❌ Cancel Booking
      </button>

    `;


    /*
      Cancel button
    */

    const cancelButton =
      card.querySelector(
        `#cancel-${ride.id}`
      );


    cancelButton.onclick =
      () => {

        cancelBooking(
          ride.id
        );

      };


    /*
      Booking status
    */

    updateBookingCard(
      card,
      ride
    );


    return card;

  }


  // =====================================================
  // UPDATE ONE BOOKING CARD
  // =====================================================

  function updateBookingCard(
    card,
    ride
  ) {

    const statusElement =
      card.querySelector(
        `#status-${ride.id}`
      );

    const fareElement =
      card.querySelector(
        `#fare-${ride.id}`
      );

    const driverElement =
      card.querySelector(
        `#driver-${ride.id}`
      );

    const cancelButton =
      card.querySelector(
        `#cancel-${ride.id}`
      );


    const status =
      ride.status ||
      "searching";


    // ===================================================
    // STATUS
    // ===================================================

    if (
      status ===
      "searching"
    ) {

      statusElement.innerHTML = `

        <div class="waiting">
          🔎 Driver-এর উত্তর অপেক্ষা করা হচ্ছে...
        </div>

        <div class="small">
          Driver আপনার Booking দেখে
          ভাড়া পাঠাবেন।
        </div>

      `;

    }

    else if (
      status ===
      "fare_sent"
    ) {

      statusElement.innerHTML = `

        <div class="waiting">
          💰 Driver ভাড়া পাঠিয়েছেন।
        </div>

        <div class="small">
          নিচে ভাড়া দেখে Accept করুন।
        </div>

      `;

    }

    else if (
      status ===
      "confirmed"
      ||
      status ===
      "fare_accepted"
    ) {

      statusElement.innerHTML = `

        <div class="success-text">
          ✅ Booking Confirmed
        </div>

        <div class="small">
          Driver আপনার Booking Confirm করেছেন।
        </div>

      `;

    }

    else if (
      status ===
      "started"
    ) {

      statusElement.innerHTML = `

        <div class="success-text">
          🚕 Ride Started
        </div>

        <div class="small">
          আপনার Ride এখন চলছে।
        </div>

      `;

    }

    else {

      statusElement.innerHTML = "";

    }


    // ===================================================
    // FARE
    // ===================================================

    fareElement.innerHTML = "";


    if (
      Number(ride.fare) > 0
    ) {

      const fareBox =
        document.createElement(
          "div"
        );

      fareBox.className =
        "fare-box";


      fareBox.innerHTML = `

        <div>
          💰 Driver-এর ভাড়া
        </div>

        <div class="fare-price">
          ₹${Number(
            ride.fare
          )}
        </div>

      `;


      /*
        শুধু fare_sent অবস্থায় Accept/Reject
        দেখাবে।
      */

      if (
        status ===
        "fare_sent"
      ) {

        const acceptButton =
          document.createElement(
            "button"
          );

        acceptButton.className =
          "success";

        acceptButton.textContent =
          "✅ এই ভাড়া গ্রহণ করুন";


        acceptButton.onclick =
          () => {

            acceptFare(
              ride.id,
              ride.fare
            );

          };


        fareBox.appendChild(
          acceptButton
        );


        const rejectButton =
          document.createElement(
            "button"
          );

        rejectButton.className =
          "secondary";

        rejectButton.textContent =
          "❌ ভাড়া গ্রহণ করব না";


        rejectButton.onclick =
          () => {

            rejectFare(
              ride.id
            );

          };


        fareBox.appendChild(
          rejectButton
        );

      }

      else {

        const accepted =
          document.createElement(
            "div"
          );

        accepted.className =
          "success-text";

        accepted.style.marginTop =
          "8px";

        accepted.textContent =
          "✅ ভাড়া গ্রহণ করা হয়েছে";

        fareBox.appendChild(
          accepted
        );

      }


      fareElement.appendChild(
        fareBox
      );

    }


    // ===================================================
    // DRIVER INFORMATION
    // ===================================================

    driverElement.innerHTML = "";


    if (
      ride.driverName ||
      ride.driverPhone ||
      ride.autoNumber
    ) {

      driverElement.innerHTML = `

        <div class="route-box">

          <h3>
            🚕 Driver Information
          </h3>

          ${
            ride.driverName
            ?
            `
            <div class="summary-row">
              <span class="label">
                👤 Driver:
              </span>
              ${escapeHtml(
                ride.driverName
              )}
            </div>
            `
            :
            ""
          }


          ${
            ride.autoNumber
            ?
            `
            <div class="summary-row">
              <span class="label">
                🚖 Auto:
              </span>
              ${escapeHtml(
                ride.autoNumber
              )}
            </div>
            `
            :
            ""
          }


          ${
            ride.driverPhone
            ?
            `
            <button
              class="primary"
              id="call-driver-${ride.id}">
              📞 Driver-কে Call
            </button>
            `
            :
            ""
          }

        </div>

      `;


      if (
        ride.driverPhone
      ) {

        const callButton =
          driverElement.querySelector(
            `#call-driver-${ride.id}`
          );


        if (callButton) {

          callButton.onclick =
            () => {

              window.location.href =
                "tel:" +
                ride.driverPhone;

            };

        }

      }

    }


    // ===================================================
    // LIVE LOCATION
    // ===================================================

    const shouldShowLocation =

      (
        status ===
        "confirmed"
        ||
        status ===
        "fare_accepted"
        ||
        status ===
        "started"
      )
      &&
      ride.driverId;


    if (
      shouldShowLocation
    ) {

      listenDriverLocation(
        ride.id,
        ride.driverId
      );

    }

    else {

      stopLocationListener(
        ride.id
      );

      const locationElement =
        card.querySelector(
          `#location-${ride.id}`
        );


      if (locationElement) {

        locationElement.innerHTML =
          "";

      }

    }


    // ===================================================
    // CANCEL BUTTON
    // ===================================================

    /*
      Completed Booking এখানে আসারই কথা নয়।

      তবে status completed হলে safety হিসেবে
      cancel button লুকিয়ে দেওয়া হচ্ছে।
    */

    if (
      status ===
      "completed"
      ||
      status ===
      "cancelled"
    ) {

      cancelButton.classList.add(
        "hidden"
      );

    }

    else {

      cancelButton.classList.remove(
        "hidden"
      );

    }

  }


  // =====================================================
  // ACCEPT FARE
  // =====================================================

  async function acceptFare(
    rideId,
    fare
  ) {

    const ok =
      confirm(
        "আপনি কি Driver-এর ₹" +
        fare +
        " ভাড়া গ্রহণ করছেন?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "confirmed",

          fareStatus:
            "accepted",

          passengerFareAcceptedAt:
            new Date()

        }

      );


      alert(
        "✅ ভাড়া গ্রহণ করা হয়েছে। Booking Confirmed!"
      );

    }

    catch (error) {

      console.error(
        "Accept Fare Error:",
        error
      );


      alert(
        "ভাড়া Accept করা যাচ্ছে না।\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // REJECT FARE
  // =====================================================

  async function rejectFare(
    rideId
  ) {

    const ok =
      confirm(
        "আপনি কি এই ভাড়া গ্রহণ করবেন না?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "fare_rejected",

          fareStatus:
            "rejected"

        }

      );


      alert(
        "❌ আপনি ভাড়া গ্রহণ করেননি।"
      );

    }

    catch (error) {

      console.error(
        "Reject Fare Error:",
        error
      );


      alert(
        "ভাড়া Reject করা যাচ্ছে না।\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // CANCEL BOOKING
  // =====================================================

  async function cancelBooking(
    rideId
  ) {

    const ok =
      confirm(
        "আপনি কি এই Booking বাতিল করতে চান?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "rides",
          rideId
        ),

        {

          status:
            "cancelled",

          cancelledBy:
            "passenger",

          cancelledAt:
            new Date()

        }

      );


      alert(
        "❌ Booking বাতিল হয়েছে।"
      );


      /*
        Firestore listener নিজে থেকেই
        cancelled Booking-টা list থেকে সরিয়ে দেবে।
      */

    }

    catch (error) {

      console.error(
        "Cancel Error:",
        error
      );


      alert(
        "Booking বাতিল করা যাচ্ছে না.\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // DRIVER LIVE LOCATION
  // =====================================================

  function listenDriverLocation(
    rideId,
    driverId
  ) {

    /*
      একই Booking-এর জন্য listener আগে থেকেই
      থাকলে নতুন করে তৈরি করা হবে না।
    */

    if (
      locationListeners.has(
        rideId
      )
    ) {

      return;

    }


    const locationRef =
      ref(
        realtimeDb,
        "drivers/" +
        driverId +
        "/location"
      );


    const unsubscribe =
      onValue(

        locationRef,

        snapshot => {

          /*
            Booking card খুঁজে বের করা।
          */

          const locationElement =
            document.getElementById(
              `location-${rideId}`
            );


          if (
            !locationElement
          ) {

            return;

          }


          const data =
            snapshot.val();


          if (
            !data ||
            data.online !== true ||
            typeof data.lat !== "number" ||
            typeof data.lng !== "number"
          ) {

            locationElement.innerHTML = `

              <div class="location-box">

                <b>
                  📍 Driver Live Location
                </b>

                <p class="small">
                  Driver-এর Live Location বর্তমানে বন্ধ আছে।
                </p>

              </div>

            `;

            return;

          }


          const lat =
            data.lat;

          const lng =
            data.lng;

          const accuracy =
            data.accuracy ||
            "";


          locationElement.innerHTML = `

            <div class="location-box">

              <b>
                🟢 Driver Live Location
              </b>

              <p class="small">
                🚕 Driver এখন Live আছেন।
              </p>

              ${
                accuracy
                ?
                `
                <p class="small">
                  Location accuracy:
                  ${accuracy} m
                </p>
                `
                :
                ""
              }


              <button
                class="success"
                id="map-${rideId}">
                📍 Google Maps-এ Driver দেখুন
              </button>

            </div>

          `;


          const mapButton =
            document.getElementById(
              `map-${rideId}`
            );


          if (mapButton) {

            mapButton.onclick =
              () => {

                window.open(

                  "https://www.google.com/maps?q=" +
                  lat +
                  "," +
                  lng,

                  "_blank"

                );

              };

          }

        },

        error => {

          console.error(
            "Location Error:",
            error
          );


          const locationElement =
            document.getElementById(
              `location-${rideId}`
            );


          if (
            locationElement
          ) {

            locationElement.innerHTML = `

              <div class="location-box">

                <b>
                  📍 Driver Live Location
                </b>

                <p class="small error">
                  Live Location পড়তে সমস্যা হচ্ছে।
                </p>

              </div>

            `;

          }

        }

      );


    locationListeners.set(
      rideId,
      unsubscribe
    );

  }


  // =====================================================
  // STOP ONE LOCATION LISTENER
  // =====================================================

  function stopLocationListener(
    rideId
  ) {

    const unsubscribe =
      locationListeners.get(
        rideId
      );


    if (
      unsubscribe
    ) {

      unsubscribe();

      locationListeners.delete(
        rideId
      );

    }

  }


  // =====================================================
  // ANONYMOUS LOGIN
  // =====================================================

  signInAnonymously(
    auth
  )

    .catch(
      error => {

        console.error(
          "Anonymous Login Error:",
          error
        );


        bookingsList.innerHTML = `

          <div class="error">

            ❌ Firebase Login হচ্ছে না।

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      }
    );


  // =====================================================
  // AUTH STATE
  // =====================================================

  onAuthStateChanged(

    auth,

    user => {

      if (!user) {
        return;
      }


      currentUser =
        user;


      /*
        খুব গুরুত্বপূর্ণ:
        Refresh হলেও Firebase Anonymous Auth-এর
        বর্তমান user পাওয়ার পর সব Booking আবার
        Firestore থেকে পড়া হবে।
      */

      listenToAllBookings();

    }

  );


  // =====================================================
  // PAGE CLEANUP
  // =====================================================

  window.addEventListener(
    "beforeunload",
    () => {

      if (
        unsubscribeBookings
      ) {

        unsubscribeBookings();

      }


      for (
        const unsubscribe
        of locationListeners.values()
      ) {

        unsubscribe();

      }


      locationListeners.clear();

    }
  );

</script>
