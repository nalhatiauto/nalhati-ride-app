<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nalhati Ride</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827
}

header{
background:#111827;
color:white;
padding:24px 18px;
text-align:center
}

header h1{margin:0;font-size:29px}
header p{margin:7px 0;color:#d1d5db}

.container{
max-width:500px;
margin:auto;
padding:18px
}

.card{
background:white;
padding:20px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 4px 15px #0001
}

label{
display:block;
font-weight:bold;
margin:14px 0 7px
}

select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px
}

.fare{
text-align:center;
font-size:30px;
font-weight:bold;
margin:22px
}

button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
font-size:17px;
font-weight:bold;
margin-top:10px
}

.book{
background:#16a34a;
color:white
}

.driver{
background:#2563eb;
color:white
}

.status{
display:none;
padding:14px;
margin-top:15px;
border-radius:12px;
background:#ecfdf5;
color:#166534;
text-align:center;
font-weight:bold
}

.ride{
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-top:12px
}

.hidden{display:none}

.small{
text-align:center;
color:#6b7280
}
</style>
</head>

<body>

<header>
<h1>🚕 Nalhati Ride</h1>
<p>আপনার যাত্রা, আপনার গাড়ি</p>
</header>

<div class="container">

<div class="card">

<h2>🚖 Auto Book করুন</h2>

<label>📍 কোথা থেকে যাবেন?</label>

<select id="from">
<option>Nalhati</option>
<option>Murarai</option>
</select>

<label>🎯 কোথায় যাবেন?</label>

<select id="to">
<option>Murarai</option>
<option>Nalhati</option>
</select>

<div class="fare">₹25</div>

<button class="book" onclick="bookRide()">
🚕 Auto Book করুন
</button>

<div id="bookingStatus" class="status"></div>

</div>


<div class="card">

<h2>👨‍✈️ Driver Mode</h2>

<p class="small">
Driver-এর নতুন Ride Request এখানে দেখা যাবে।
</p>

<button class="driver" onclick="showDriver()">
Driver Mode চালু করুন
</button>

<div id="driverArea" class="hidden">

<hr>

<h3>🚨 Ride Requests</h3>

<div id="rides">
<p class="small">কোনো নতুন Ride নেই।</p>
</div>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

authDomain:"nalhati-ride.firebaseapp.com",

projectId:"nalhati-ride",

storageBucket:"nalhati-ride.firebasestorage.app",

messagingSenderId:"1077953215118",

appId:"1:1077953215118:web:7d73eac073d30523dda7df",

measurementId:"G-BPZT7JKDH7"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let currentUser=null;


signInAnonymously(auth)

.then(userCredential=>{

currentUser=userCredential.user;

console.log("Firebase connected");

})

.catch(error=>{

console.error(error);

});


window.bookRide=async function(){

const from=document.getElementById("from").value;

const to=document.getElementById("to").value;


if(from===to){

alert("Pickup এবং Destination আলাদা হতে হবে।");

return;

}


try{

await addDoc(collection(db,"rides"),{

from:from,

to:to,

fare:25,

status:"requested",

createdAt:new Date(),

passengerId:currentUser ? currentUser.uid : "anonymous"

});


const status=document.getElementById("bookingStatus");

status.style.display="block";

status.innerHTML=
"✅ Ride Request পাঠানো হয়েছে!<br>"+
"🚕 কাছাকাছি Driver খোঁজা হচ্ছে...";

}

catch(error){

alert("Booking করা যায়নি। Firebase connection পরীক্ষা করুন।");

console.error(error);

}

};


window.showDriver=function(){

document.getElementById("driverArea").classList.remove("hidden");

loadRides();

};


function loadRides(){

const ridesRef=collection(db,"rides");

const q=query(ridesRef,orderBy("createdAt","desc"));


onSnapshot(q,snapshot=>{

const rides=document.getElementById("rides");

rides.innerHTML="";


if(snapshot.empty){

rides.innerHTML="<p class='small'>কোনো নতুন Ride নেই।</p>";

return;

}


snapshot.forEach(doc=>{

const ride=doc.data();

const div=document.createElement("div");

div.className="ride";

div.innerHTML=

"<b>📍 "+ride.from+" → "+ride.to+"</b>"+

"<p>💰 ভাড়া: ₹"+ride.fare+"</p>"+

"<p>📋 Status: "+ride.status+"</p>"+

"<button class='book' onclick='acceptRide(\""+doc.id+"\")'>"+
"✅ Ride Accept করুন"+
"</button>";

rides.appendChild(div);

});

});

}


window.acceptRide=function(id){

alert("Ride Accepted! Ride ID: "+id);

};

</script>

</body>
</html>
