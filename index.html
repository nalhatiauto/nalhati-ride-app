<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nalhati Ride</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.header{
  background:#111827;
  color:white;
  padding:25px 20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:500px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 5px 18px #00000015;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.fare{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:22px 0;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.book{
  background:#16a34a;
  color:white;
}

.driver{
  background:#2563eb;
  color:white;
}

.status{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#ecfdf5;
  color:#166534;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.driverBox{
  display:none;
  margin-top:20px;
}

.small{
  color:#6b7280;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
  <h1>🚕 Nalhati Ride</h1>
  <p>আপনার যাত্রা, আপনার গাড়ি</p>
</div>

<div class="container">

<div class="card">

<h2>🚖 Auto Book করুন</h2>

<label>📍 কোথা থেকে যাবেন?</label>

<select id="from">
<option>Nalhati</option>
<option>Murarai</option>
</select>

<label>🎯 কোথায় যাবেন?</label>

<select id="to">
<option>Murarai</option>
<option>Nalhati</option>
</select>

<div class="fare">₹25</div>

<button class="book" onclick="bookRide()">
🚕 Auto Book করুন
</button>

<div id="status" class="status">
✅ Ride Request পাঠানো হয়েছে!<br>
Driver খোঁজা হচ্ছে...
</div>

</div>

<div class="card">

<h2>👨‍✈️ Driver Mode</h2>

<p class="small">
Driver হিসেবে Ride Request গ্রহণ করুন
</p>

<button class="driver" onclick="driverMode()">
Driver Mode চালু করুন
</button>

<div id="driverBox" class="driverBox">

<hr>

<h3>🚨 নতুন Ride Request</h3>

<p>📍 Nalhati → Murarai</p>
<p>💰 ভাড়া: ₹25</p>

<button class="book" onclick="acceptRide()">
✅ Ride Accept করুন
</button>

</div>

</div>

</div>

<script>

function bookRide(){

document.getElementById("status").style.display="block";

}

function driverMode(){

document.getElementById("driverBox").style.display="block";

}

function acceptRide(){

document.getElementById("driverBox").innerHTML=

"<h3>✅ Ride Accepted</h3>"+
"<p>Passenger-এর Ride আপনি গ্রহণ করেছেন।</p>"+
"<button class='driver' onclick='callPassenger()'>📞 Passenger-কে Call করুন</button>";

}

function callPassenger(){

alert("Passenger-এর সঙ্গে যোগাযোগের ব্যবস্থা পরে যোগ করা হবে।");

}

</script>

</body>
</html>
