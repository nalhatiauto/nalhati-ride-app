<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride - Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .online {
      background: #dcfce7;
      color: #15803d;
      padding: 13px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .profile-card,
    .ride-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .profile-card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .profile-card input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    .save-profile {
      width: 100%;
      background: #111827;
      color: white;
    }

    .profile-saved {
      background: #ecfdf5;
      color: #166534;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .reserve {
      border: 2px solid #f59e0b;
    }

    .active {
      border: 2px solid #16a34a;
    }

    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .reserve .badge {
      background: #fff7ed;
      color: #c2410c;
    }

    .active .badge {
      background: #dcfce7;
      color: #15803d;
    }

    .details {
      line-height: 1.8;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .complete {
      background: #7c3aed;
      color: white;
    }

    .call {
      display: block;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #16a34a;
      padding: 13px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #6b7280;
    }

    .note {
      background: #f9fafb;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
    }

    .passenger-info {
      background: #fff7ed;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚖 Nalhati Ride</h1>
    <p>Driver App</p>
  </div>

  <div class="container">

    <div class="online">
      🟢 Driver Online
    </div>

    <!-- DRIVER PROFILE -->
    <div class="profile-card">

      <h2>👤 Driver Profile</h2>

      <input
        type="text"
        id="driverName"
        placeholder="Driver Name"
      >

      <input
        type="tel"
        id="driverPhone"
        placeholder="Phone Number"
        maxlength="10"
      >

      <input
        type="text"
        id="autoNumber"
        placeholder="Auto Number"
      >

      <button
        class="save-profile"
        id="saveProfile">
        💾 Save Profile
      </button>

      <div
        class="profile-saved"
        id="profileSaved">
        ✅ Profile Saved
      </div>

    </div>

    <div id="ridesContainer">
      <div class="empty">
        Booking খোঁজা হচ্ছে...
      </div>
    </div>

  </div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // =========================
  // FIREBASE
  // =========================

  const firebaseConfig = {
    apiKey: "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",
    authDomain: "nalhati-ride.firebaseapp.com",
    projectId: "nalhati-ride",
    storageBucket: "nalhati-ride.firebasestorage.app",
    messagingSenderId: "1077953215118",
    appId: "1:1077953215118:web:7d73eac073d30523dda7df",
    measurementId: "G-BPZT7JKDH7"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  let driverUser = null;


  const ridesContainer =
    document.getElementById("ridesContainer");


  // =========================
  // PROFILE
  // =========================

  const driverNameInput =
    document.getElementById("driverName");

  const driverPhoneInput =
    document.getElementById("driverPhone");

  const autoNumberInput =
    document.getElementById("autoNumber");

  const saveProfileButton =
    document.getElementById("saveProfile");

  const profileSaved =
    document.getElementById("profileSaved");


  // Load saved profile

  driverNameInput.value =
    localStorage.getItem("nalhatiDriverName") || "";

  driverPhoneInput.value =
    localStorage.getItem("nalhatiDriverPhone") || "";

  autoNumberInput.value =
    localStorage.getItem("nalhatiAutoNumber") || "";


  // =========================
  // SAVE PROFILE
  // =========================

  saveProfileButton.addEventListener(
    "click",
    () => {

      const name =
        driverNameInput.value.trim();

      const phone =
        driverPhoneInput.value.trim();

      const autoNumber =
        autoNumberInput.value.trim();


      if (!name) {

        alert("Driver Name দিন।");

        return;
      }


      if (!/^[0-9]{10}$/.test(phone)) {

        alert(
          "সঠিক 10 সংখ্যার Phone Number দিন।"
        );

        return;
      }


      localStorage.setItem(
        "nalhatiDriverName",
        name
      );

      localStorage.setItem(
        "nalhatiDriverPhone",
        phone
      );

      localStorage.setItem(
        "nalhatiAutoNumber",
        autoNumber
      );


      profileSaved.style.display =
        "block";


      setTimeout(() => {

        profileSaved.style.display =
          "none";

      }, 2500);

    }
  );


  // =========================
  // FIREBASE LOGIN
  // =========================

  signInAnonymously(auth)
    .catch((error) => {

      console.error(error);

      ridesContainer.innerHTML = `
        <div class="empty">
          Driver Login করতে সমস্যা হয়েছে।
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

    });


  onAuthStateChanged(auth, (user) => {

    if (user) {

      driverUser = user;

      loadRides();

    }

  });


  // =========================
  // LOAD ALL RIDES
  // =========================

  function loadRides() {

    const q =
      query(
        collection(db, "rides"),
        orderBy("createdAt", "desc")
      );


    onSnapshot(
      q,

      (snapshot) => {

        ridesContainer.innerHTML = "";

        let found = false;


        snapshot.forEach((docSnap) => {

          const ride =
            docSnap.data();

          const rideId =
            docSnap.id;


          // New booking

          if (ride.status === "searching") {

            found = true;

            showSearchingRide(
              ride,
              rideId
            );

          }


          // This driver's accepted/started ride

          if (
            (ride.status === "accepted" ||
             ride.status === "started") &&
            ride.driverId === driverUser.uid
          ) {

            found = true;

            showActiveRide(
              ride,
              rideId
            );

          }

        });


        if (!found) {

          ridesContainer.innerHTML = `
            <div class="empty">

              <div style="font-size:40px;">
                🚗
              </div>

              <h3>
                এখন কোনো নতুন Booking নেই
              </h3>

              <p>
                Passenger Booking করলে এখানে দেখা যাবে।
              </p>

            </div>
          `;

        }

      },

      (error) => {

        console.error(error);

        ridesContainer.innerHTML = `
          <div class="empty">
            Booking load করতে সমস্যা হয়েছে।
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }
    );

  }


  // =========================
  // SEARCHING RIDE
  // =========================

  function showSearchingRide(
    ride,
    rideId
  ) {

    const isReserve =
      ride.type === "reserve";


    const card =
      document.createElement("div");


    card.className =
      isReserve
        ? "ride-card reserve"
        : "ride-card";


    let fareText =
      isReserve
        ? (
            ride.fare && ride.fare > 0
              ? `₹${ride.fare}`
              : "আলোচনা সাপেক্ষে"
          )
        : `₹${ride.fare || 25}`;


    let reserveDetails = "";


    if (isReserve) {

      reserveDetails = `

        <div>
          👥 <strong>যাত্রী:</strong>
          ${ride.passengers || 1} জন
        </div>

        <div>
          📅 <strong>তারিখ:</strong>
          ${escapeHtml(ride.date || "-")}
        </div>

        <div>
          ⏰ <strong>সময়:</strong>
          ${escapeHtml(ride.time || "-")}
        </div>

        <div>
          💰 <strong>ভাড়া:</strong>
          ${fareText}
        </div>

        ${
          ride.note
            ? `
              <div class="note">
                📝 <strong>Passenger Note:</strong><br>
                ${escapeHtml(ride.note)}
              </div>
            `
            : ""
        }

      `;

    } else {

      reserveDetails = `

        <div>
          💰 <strong>ভাড়া:</strong>
          ${fareText}
        </div>

      `;

    }


    // PASSENGER INFORMATION

    const passengerInfo = `

      <div class="passenger-info">

        👤 <strong>Passenger:</strong>
        ${escapeHtml(
          ride.passengerName || "নাম দেওয়া হয়নি"
        )}

        <br>

        📱 <strong>Phone:</strong>
        ${escapeHtml(
          ride.passengerPhone || "নম্বর দেওয়া হয়নি"
        )}

        ${
          ride.passengerPhone
            ? `
              <a
                class="call"
                href="tel:${escapeHtml(
                  ride.passengerPhone
                )}">
                📞 Call Passenger
              </a>
            `
            : ""
        }

      </div>

    `;


    card.innerHTML = `

      <div class="badge">

        ${
          isReserve
            ? "🚕 RESERVE AUTO"
            : "🚖 NORMAL RIDE"
        }

      </div>


      <div class="details">

        <div>
          📍 <strong>Pickup:</strong>
          ${escapeHtml(ride.from || "-")}
        </div>

        <div>
          🏁 <strong>Destination:</strong>
          ${escapeHtml(ride.to || "-")}
        </div>

        ${reserveDetails}

        ${passengerInfo}

      </div>


      <div class="buttons">

        <button
          class="accept"
          id="accept-${rideId}">
          ✅ Accept
        </button>

        ${
          isReserve
            ? `
              <button
                class="reject"
                id="reject-${rideId}">
                ❌ Reject
              </button>
            `
            : ""
        }

      </div>


      <div class="small"
           style="margin-top:10px;">
        Booking ID: ${escapeHtml(rideId)}
      </div>

    `;


    ridesContainer.appendChild(card);


    document
      .getElementById(
        `accept-${rideId}`
      )
      .addEventListener(
        "click",
        () => acceptRide(rideId)
      );


    if (isReserve) {

      document
        .getElementById(
          `reject-${rideId}`
        )
        .addEventListener(
          "click",
          () => rejectRide(rideId)
        );

    }

  }


  // =========================
  // ACCEPT
  // =========================

  async function acceptRide(rideId) {

    if (!driverUser) {

      alert(
        "Driver Login এখনো প্রস্তুত হয়নি।"
      );

      return;
    }


    const name =
      driverNameInput.value.trim();

    const phone =
      driverPhoneInput.value.trim();

    const autoNumber =
      autoNumberInput.value.trim();


    if (!name) {

      alert(
        "আগে Driver Profile-এ Name Save করুন।"
      );

      return;
    }


    if (!/^[0-9]{10}$/.test(phone)) {

      alert(
        "সঠিক 10 সংখ্যার Phone Number দিন।"
      );

      return;
    }


    try {

      await updateDoc(
        doc(db, "rides", rideId),
        {

          status: "accepted",

          driverId:
            driverUser.uid,

          driverName:
            name,

          driverPhone:
            phone,

          autoNumber:
            autoNumber

        }
      );


      alert(
        "✅ Booking Accept হয়েছে!"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Accept করতে সমস্যা হয়েছে:\n" +
        error.message
      );

    }

  }


  // =========================
  // REJECT
  // =========================

  async function rejectRide(rideId) {

    const ok =
      confirm(
        "এই Reserve Booking Reject করবেন?"
      );


    if (!ok) {
      return;
    }


    try {

      await updateDoc(
        doc(db, "rides", rideId),
        {

          status: "cancelled",

          driverId:
            driverUser.uid

        }
      );


      alert(
        "Booking Reject করা হয়েছে।"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Reject করতে সমস্যা হয়েছে।"
      );

    }

  }


  // =========================
  // ACTIVE RIDE
  // =========================

  function showActiveRide(
    ride,
    rideId
  ) {

    const card =
      document.createElement("div");


    card.className =
      "ride-card active";


    let actionButton = "";


    if (ride.status === "accepted") {

      actionButton = `

        <button
          class="start"
          id="start-${rideId}">
          🚗 Start Ride
        </button>

      `;

    }


    if (ride.status === "started") {

      actionButton = `

        <button
          class="complete"
          id="complete-${rideId}">
          ✅ Complete Ride
        </button>

      `;

    }


    card.innerHTML = `

      <div class="badge">

        ${
          ride.status === "accepted"
            ? "✅ BOOKING ACCEPTED"
            : "🚗 RIDE STARTED"
        }

      </div>


      <div class="details">

        <div>
          📍 <strong>Pickup:</strong>
          ${escapeHtml(ride.from || "-")}
        </div>

        <div>
          🏁 <strong>Destination:</strong>
          ${escapeHtml(ride.to || "-")}
        </div>

        <div>
          💰 <strong>ভাড়া:</strong>
          ₹${ride.fare || 25}
        </div>


        <div class="passenger-info">

          👤 <strong>Passenger:</strong>
          ${escapeHtml(
            ride.passengerName ||
            "নাম দেওয়া হয়নি"
          )}

          <br>

          📱 <strong>Phone:</strong>
          ${escapeHtml(
            ride.passengerPhone ||
            "নম্বর দেওয়া হয়নি"
          )}

          ${
            ride.passengerPhone
              ? `
                <a
                  class="call"
                  href="tel:${escapeHtml(
                    ride.passengerPhone
                  )}">
                  📞 Call Passenger
                </a>
              `
              : ""
          }

        </div>


        <div style="
          background:#eff6ff;
          padding:12px;
          border-radius:10px;
          margin-top:12px;
          line-height:1.7;
        ">

          👨‍✈️ <strong>Driver:</strong>
          ${escapeHtml(
            ride.driverName || ""
          )}

          <br>

          📞 Driver Phone:
          ${escapeHtml(
            ride.driverPhone || ""
          )}

          <br>

          🚖 Auto:
          ${escapeHtml(
            ride.autoNumber ||
            "Auto Number দেওয়া হয়নি"
          )}

        </div>

      </div>


      <div class="buttons">

        ${actionButton}

      </div>


      <div class="small"
           style="margin-top:10px;">
        Booking ID:
        ${escapeHtml(rideId)}
      </div>

    `;


    ridesContainer.appendChild(card);


    if (ride.status === "accepted") {

      document
        .getElementById(
          `start-${rideId}`
        )
        .addEventListener(
          "click",
          () => startRide(rideId)
        );

    }


    if (ride.status === "started") {

      document
        .getElementById(
          `complete-${rideId}`
        )
        .addEventListener(
          "click",
          () => completeRide(rideId)
        );

    }

  }


  // =========================
  // START RIDE
  // =========================

  async function startRide(rideId) {

    try {

      await updateDoc(
        doc(db, "rides", rideId),
        {
          status: "started"
        }
      );


      alert(
        "🚗 Ride Started!"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Ride Start করতে সমস্যা হয়েছে।"
      );

    }

  }


  // =========================
  // COMPLETE RIDE
  // =========================

  async function completeRide(rideId) {

    try {

      await updateDoc(
        doc(db, "rides", rideId),
        {
          status: "completed"
        }
      );


      alert(
        "✅ Ride Completed!"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Complete করতে সমস্যা হয়েছে।"
      );

    }

  }


  // =========================
  // ESCAPE HTML
  // =========================

  function escapeHtml(text) {

    return String(text ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =========================
  // PHONE INPUT
  // =========================

  driverPhoneInput.addEventListener(
    "input",
    () => {

      driverPhoneInput.value =
        driverPhoneInput.value
          .replace(/\D/g, "")
          .slice(0, 10);

    }
  );

</script>

</body>
</html>
