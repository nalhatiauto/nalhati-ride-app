<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride - Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .online {
      background: #dcfce7;
      color: #15803d;
      padding: 13px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .ride-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .reserve {
      border: 2px solid #f59e0b;
    }

    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .reserve .badge {
      background: #fff7ed;
      color: #c2410c;
    }

    .details {
      line-height: 1.8;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .complete {
      background: #7c3aed;
      color: white;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #6b7280;
    }

    .accepted-box {
      background: #ecfdf5;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .note {
      background: #f9fafb;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚖 Nalhati Ride</h1>
    <p>Driver App</p>
  </div>

  <div class="container">

    <div class="online">
      🟢 Driver Online
    </div>

    <div id="ridesContainer">
      <div class="empty">
        Booking খোঁজা হচ্ছে...
      </div>
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",
      authDomain: "nalhati-ride.firebaseapp.com",
      projectId: "nalhati-ride",
      storageBucket: "nalhati-ride.firebasestorage.app",
      messagingSenderId: "1077953215118",
      appId: "1:1077953215118:web:7d73eac073d30523dda7df",
      measurementId: "G-BPZT7JKDH7"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let driverUser = null;


    const ridesContainer =
      document.getElementById("ridesContainer");


    // Driver Login
    signInAnonymously(auth)
      .catch((error) => {

        console.error(error);

        ridesContainer.innerHTML = `
          <div class="empty">
            Driver Login করতে সমস্যা হয়েছে।
          </div>
        `;

      });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        driverUser = user;

        loadRides();

      }

    });


    // Load Rides
    function loadRides() {

      const q =
        query(
          collection(db, "rides"),
          orderBy("createdAt", "desc")
        );


      onSnapshot(
        q,

        (snapshot) => {

          ridesContainer.innerHTML = "";


          let found = false;


          snapshot.forEach((docSnap) => {

            const ride =
              docSnap.data();

            const rideId =
              docSnap.id;


            // SEARCHING BOOKINGS
            if (ride.status === "searching") {

              found = true;

              showSearchingRide(
                ride,
                rideId
              );

            }

          });


          if (!found) {

            ridesContainer.innerHTML = `
              <div class="empty">
                <div style="font-size:40px;">🚗</div>

                <h3>এখন কোনো নতুন Booking নেই</h3>

                <p>
                  Passenger Booking করলে এখানে দেখা যাবে।
                </p>
              </div>
            `;

          }

        },

        (error) => {

          console.error(error);

          ridesContainer.innerHTML = `
            <div class="empty">
              Booking load করতে সমস্যা হয়েছে।
              <br><br>
              ${error.message}
            </div>
          `;

        }
      );

    }


    // SEARCHING RIDE CARD
    function showSearchingRide(ride, rideId) {

      const isReserve =
        ride.type === "reserve";


      const card =
        document.createElement("div");


      card.className =
        isReserve
          ? "ride-card reserve"
          : "ride-card";


      let fareText = "";

      if (isReserve) {

        fareText =
          ride.fare && ride.fare > 0
            ? `₹${ride.fare}`
            : "আলোচনা সাপেক্ষে";

      } else {

        fareText =
          `₹${ride.fare || 25}`;

      }


      let reserveDetails = "";

      if (isReserve) {

        reserveDetails = `

          <div>
            👥 <strong>যাত্রী:</strong>
            ${ride.passengers || 1} জন
          </div>

          <div>
            📅 <strong>তারিখ:</strong>
            ${ride.date || "-"}
          </div>

          <div>
            ⏰ <strong>সময়:</strong>
            ${ride.time || "-"}
          </div>

          <div>
            💰 <strong>ভাড়া:</strong>
            ${fareText}
          </div>

          ${
            ride.note
              ? `
                <div class="note">
                  📝 <strong>Passenger Note:</strong><br>
                  ${escapeHtml(ride.note)}
                </div>
              `
              : ""
          }

        `;

      } else {

        reserveDetails = `

          <div>
            💰 <strong>ভাড়া:</strong>
            ${fareText}
          </div>

        `;

      }


      card.innerHTML = `

        <div class="badge">

          ${
            isReserve
              ? "🚕 RESERVE AUTO"
              : "🚖 NORMAL RIDE"
          }

        </div>


        <div class="details">

          <div>
            📍 <strong>Pickup:</strong>
            ${escapeHtml(ride.from || "-")}
          </div>

          <div>
            🏁 <strong>Destination:</strong>
            ${escapeHtml(ride.to || "-")}
          </div>

          ${reserveDetails}

        </div>


        <div class="buttons">

          <button
            class="accept"
            id="accept-${rideId}">
            ✅ Accept
          </button>

          ${
            isReserve
              ? `
                <button
                  class="reject"
                  id="reject-${rideId}">
                  ❌ Reject
                </button>
              `
              : ""
          }

        </div>

        <div class="small" style="margin-top:10px;">
          Booking ID: ${rideId}
        </div>

      `;


      ridesContainer.appendChild(card);


      document
        .getElementById(`accept-${rideId}`)
        .addEventListener(
          "click",
          () => acceptRide(rideId)
        );


      if (isReserve) {

        document
          .getElementById(`reject-${rideId}`)
          .addEventListener(
            "click",
            () => rejectRide(rideId)
          );

      }

    }


    // ACCEPT
    async function acceptRide(rideId) {

      try {

        await updateDoc(
          doc(db, "rides", rideId),
          {
            status: "accepted",
            driverId: driverUser.uid
          }
        );


        alert(
          "✅ Booking Accept হয়েছে!"
        );


        showAcceptedRide(rideId);

      } catch (error) {

        console.error(error);

        alert(
          "Accept করতে সমস্যা হয়েছে: " +
          error.message
        );

      }

    }


    // REJECT
    async function rejectRide(rideId) {

      const ok =
        confirm(
          "এই Reserve Booking Reject করবেন?"
        );


      if (!ok) {
        return;
      }


      try {

        await updateDoc(
          doc(db, "rides", rideId),
          {
            status: "cancelled",
            driverId: driverUser.uid
          }
        );


        alert(
          "Booking Reject করা হয়েছে।"
        );

      } catch (error) {

        console.error(error);

        alert(
          "Reject করতে সমস্যা হয়েছে।"
        );

      }

    }


    // ACCEPTED RIDE
    function showAcceptedRide(rideId) {

      const card =
        document.querySelector(
          `[id="accept-${rideId}"]`
        );


      if (!card) {
        return;
      }

      const rideCard =
        card.closest(".ride-card");


      if (!rideCard) {
        return;
      }


      const buttons =
        rideCard.querySelector(".buttons");


      buttons.innerHTML = `

        <button
          class="start"
          id="start-${rideId}">
          🚗 Start Ride
        </button>

      `;


      document
        .getElementById(`start-${rideId}`)
        .addEventListener(
          "click",
          () => startRide(rideId)
        );

    }


    // START RIDE
    async function startRide(rideId) {

      try {

        await updateDoc(
          doc(db, "rides", rideId),
          {
            status: "started"
          }
        );


        alert(
          "🚗 Ride Started!"
        );


        showCompleteButton(rideId);

      } catch (error) {

        console.error(error);

        alert(
          "Ride Start করতে সমস্যা হয়েছে।"
        );

      }

    }


    // COMPLETE BUTTON
    function showCompleteButton(rideId) {

      const startButton =
        document.getElementById(
          `start-${rideId}`
        );


      if (!startButton) {
        return;
      }


      const rideCard =
        startButton.closest(".ride-card");


      const buttons =
        rideCard.querySelector(".buttons");


      buttons.innerHTML = `

        <button
          class="complete"
          id="complete-${rideId}">
          ✅ Complete Ride
        </button>

      `;


      document
        .getElementById(`complete-${rideId}`)
        .addEventListener(
          "click",
          () => completeRide(rideId)
        );

    }


    // COMPLETE
    async function completeRide(rideId) {

      try {

        await updateDoc(
          doc(db, "rides", rideId),
          {
            status: "completed"
          }
        );


        alert(
          "✅ Ride Completed!"
        );

      } catch (error) {

        console.error(error);

        alert(
          "Complete করতে সমস্যা হয়েছে।"
        );

      }

    }


    // Prevent HTML injection in notes
    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
